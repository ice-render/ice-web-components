<!DOCTYPE html>
<html lang="en">
  <meta charset="utf-8" />
  <title>ice-web-components basic</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #0f172a;
    }
    canvas {
      display: block;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      background: #ffffff;
    }
  </style>
  <body>
    <h1>ice-web-components basic</h1>
    <canvas id="canvas" width="1200" height="800"></canvas>

    <script src="../node_modules/ice-render/dist/index.umd.js"></script>
    <script src="../dist/index.umd.js"></script>
    <script>
      const ice = new ICE.ICE().init('canvas');
      new ICEWEB.UIHoverManager(ice).start();

      const panel = new ICEWEB.UIPanel({
        id: 'panel',
        left: 80,
        top: 80,
        width: 760,
        height: 220,
      });
      panel.setUILayout(new ICEWEB.UIFlowLayout({ gap: 18, align: 'left' }));

      const title = new ICEWEB.UILabel({
        id: 'title',
        text: 'Swing-style Canvas UI',
        style: { fontSize: 22, fontWeight: 'bold', fillStyle: '#0f172a' },
      });

      const button = new ICEWEB.UIButton({
        id: 'button',
        text: 'Button',
        width: 120,
        height: 44,
      });

      const second = new ICEWEB.UIButton({
        id: 'second',
        text: 'Another',
        width: 130,
        height: 44,
      });

      panel.addChildren([title, button, second]);
      ice.addChild(panel);

      window.__result = { ice, panel, title, button };
    </script>
  </body>
</html>
