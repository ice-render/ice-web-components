<!DOCTYPE html>
<html lang="en">
  <meta charset="utf-8" />
  <title>ice-web-components gallery</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: rgba(0, 0, 0, 0.88);
    }
    canvas {
      display: block;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }
  </style>
  <body>
    <h1 style="font-size: 20px; margin: 0 0 16px">ice-web-components gallery</h1>
    <canvas id="canvas" width="1400" height="1960"></canvas>

    <script src="../node_modules/ice-render/dist/index.umd.js"></script>
    <script src="../dist/index.umd.js"></script>
    <script>
      const ice = new ICE.ICE().init('canvas');
      const W = ICEWEB;
      const theme = W.uiManager.getTheme();
      new W.UIHoverManager(ice).start();
      W.getUIFocusManager(ice).start();

      const heading = (text, left, top) =>
        new W.UILabel({
          left,
          top,
          text,
          style: {
            fontSize: 15,
            fontWeight: '600',
            fillStyle: theme.colors.text,
          },
        });

      const caption = (text, left, top) =>
        new W.UILabel({ left, top, text, style: { fontSize: 12, fillStyle: theme.colors.textSecondary } });

      const panel = new W.UIPanel({ id: 'panel', left: 24, top: 24, width: 1352, height: 1912 });

      // 滚动视口演示：内容比视口高，靠引擎的 clipChildren 裁掉溢出部分
      // 注意：容器要先创建、再加子组件（引擎按全局 zIndex 排序渲染）
      const scrollPane = new W.UIScrollPane({ id: 'scroll-pane', left: 32, top: 736, width: 300, height: 96 });
      const scrollContent = new W.UIComponent({ width: 268, height: 264 });
      for (let i = 0; i < 12; i++) {
        const row = new W.UIPanel({
          left: 0,
          top: i * 22,
          width: 268,
          height: 20,
          radius: 4,
          style: {
            fillStyle: i % 2 ? theme.colors.background : theme.colors.surface,
            strokeStyle: theme.colors.border,
          },
        });
        row.addChild(new W.UILabel({ left: 8, top: 3, text: 'Row #' + (i + 1), style: { fontSize: 12 } }), false);
        scrollContent.addChild(row, false);
      }
      scrollPane.setContent(scrollContent);

      // 表单演示：必填校验 + 提交反馈
      const form = new W.UIForm({ left: 420, top: 656, width: 320, gap: 12 });
      const nameInput = new W.UITextField({ width: 240, height: 32, placeholder: 'Your name' });
      const agreeBox = new W.UICheckBox({ width: 24, height: 24 });
      form.addItems([
        new W.UIFormItem({ name: 'name', label: 'Name', control: nameInput, rules: [{ required: true }] }),
        new W.UIFormItem({
          name: 'agree',
          label: 'Agree to terms',
          control: agreeBox,
          rules: [{ required: true, message: '请先同意条款' }],
        }),
      ]);
      const submitTop = 656 + form.state.height + 10;
      const submitButton = new W.UIButton({ left: 420, top: submitTop, width: 120, height: 32, text: 'Submit' });
      const submitHint = new W.UILabel({
        left: 552,
        top: submitTop + 8,
        text: '',
        style: { fontSize: 12, fillStyle: theme.colors.success },
      });
      submitButton.on('click', () => {
        const ok = form.submit();
        submitHint.setText(ok ? 'Submitted ✓' : '');
      });

      // 反馈类组件演示：Tooltip（悬停）/ Popover（点击）/ Popconfirm（危险确认）
      const tipTarget = new W.UIButton({ id: 'tip-btn', left: 820, top: 656, width: 110, height: 32, text: 'Hover me' });
      W.attachTooltip(ice, tipTarget, { title: '这是工具提示', placement: 'top' });

      const popoverTarget = new W.UIButton({
        id: 'pop-btn',
        left: 946,
        top: 656,
        width: 148,
        height: 32,
        text: 'Show popover',
        variant: 'default',
      });
      W.attachPopover(ice, popoverTarget, { title: '浮层标题', content: '点击外部关闭' });

      const deleteTarget = new W.UIButton({ id: 'del-btn', left: 820, top: 700, width: 140, height: 32, text: 'Delete', danger: true });
      const deleteHint = new W.UILabel({
        left: 974,
        top: 708,
        text: '',
        style: { fontSize: 12, fillStyle: theme.colors.success },
      });
      const messageTarget = new W.UIButton({ id: 'msg-btn', left: 820, top: 744, width: 148, height: 32, text: 'Show message' });
      messageTarget.on('click', () => {
        W.UIMessage.success(ice, '已保存');
        W.UIMessage.info(ice, '正在同步数据');
      });
      const notifyTarget = new W.UIButton({
        id: 'notify-btn',
        left: 974,
        top: 744,
        width: 140,
        height: 32,
        text: 'Notify',
        variant: 'default',
      });
      notifyTarget.on('click', () => {
        W.UINotification.open(ice, { title: '部署完成', description: 'v1.4.0 已上线' });
      });

      const modalTarget = new W.UIButton({ id: 'modal-btn', left: 1106, top: 656, width: 130, height: 32, text: 'Open modal' });
      const modalHint = new W.UILabel({
        left: 1106,
        top: 708,
        text: '',
        style: { fontSize: 12, fillStyle: theme.colors.success },
      });
      const modal = new W.UIModal(ice, {
        title: '确认发布？',
        content: '发布后所有用户立即可见。',
        width: 380,
        onConfirm: () => modalHint.setText('已发布 ✓'),
      });
      modalTarget.on('click', () => modal.open());

      W.attachPopconfirm(ice, deleteTarget, {
        title: '确认删除？',
        description: '删除后不可恢复',
        danger: true,
        onConfirm: () => deleteHint.setText('已删除 ✓'),
      });

      const pageHint = new W.UILabel({
        left: 820,
        top: 776,
        text: '第 1 页 / 每页 10 条',
        style: { fontSize: 12, fillStyle: theme.colors.textSecondary },
      });
      const pagination = new W.UIPagination({
        id: 'pagination',
        left: 820,
        top: 800,
        width: 420,
        total: 238,
        pageSize: 10,
        showTotal: true,
        showSizeChanger: true,
        onChange: (page, pageSize) => pageHint.setText(`第 ${page} 页 / 每页 ${pageSize} 条`),
      });

      // 选择器演示：单选 + 搜索（放在 Feedback 区下方）
      const cityHint = new W.UILabel({
        left: 1106,
        top: 776,
        text: '未选择城市',
        style: { fontSize: 12, fillStyle: theme.colors.textSecondary },
      });
      const citySelect = new W.UISelect({
        id: 'city-select',
        left: 1106,
        top: 800,
        width: 180,
        height: 32,
        placeholder: '请选择城市',
        showSearch: true,
        options: [
          { value: 'hangzhou', label: '杭州' },
          { value: 'shanghai', label: '上海' },
          { value: 'shenzhen', label: '深圳', disabled: true },
          { value: 'beijing', label: '北京' },
        ],
        onChange: (value, option) => cityHint.setText('已选择：' + option.label),
      });

      const drawerTarget = new W.UIButton({ id: 'drawer-btn', left: 1120, top: 744, width: 130, height: 32, text: 'Open drawer' });
      const drawer = new W.UIDrawer(ice, {
        title: '抽屉',
        content: '从右侧滑入，点遮罩或 ✕ 关闭。',
        width: 300,
      });
      drawerTarget.on('click', () => drawer.open());

      // 列表演示：多选 + 内部滚动（内容超出高度时自动套 UIScrollPane）
      const listHint = new W.UILabel({
        left: 820,
        top: 828,
        text: '未选择',
        style: { fontSize: 12, fillStyle: theme.colors.textSecondary },
      });
      const cityList = new W.UIList({
        id: 'city-list',
        left: 820,
        top: 860,
        width: 300,
        height: 120,
        mode: 'multiple',
        itemHeight: 36,
        items: [
          { key: 'a', label: '苹果' },
          { key: 'b', label: '香蕉' },
          { key: 'c', label: '橙子', disabled: true },
          { key: 'd', label: '葡萄' },
          { key: 'e', label: '西瓜' },
          { key: 'f', label: '草莓' },
        ],
        onChange: (keys) => listHint.setText(keys.length ? '已选：' + keys.join('、') : '未选择'),
      });

      // 树演示：两级结构 + 展开/折叠 + 单选
      const treeHint = new W.UILabel({
        left: 1140,
        top: 828,
        text: '未选择节点',
        style: { fontSize: 12, fillStyle: theme.colors.textSecondary },
      });
      const tree = new W.UITree({
        id: 'tree',
        left: 1140,
        top: 856,
        width: 200,
        height: 150,
        defaultExpandAll: true,
        nodes: [
          {
            key: 'root',
            label: '数据源',
            children: [
              { key: 'mysql', label: 'MySQL' },
              { key: 'pg', label: 'PostgreSQL' },
              { key: 'cache', label: '缓存', children: [{ key: 'redis', label: 'Redis' }] },
            ],
          },
          { key: 'logs', label: '日志' },
        ],
        onSelect: (keys, node) => treeHint.setText(node ? '已选择：' + node.label : '未选择节点'),
      });

      // 更多输入与状态：多行文本框 / 密码框 / 分段控制器 / 空状态 / 骨架屏
      const bioArea = new W.UITextArea({ id: 'bio', left: 32, top: 1066, width: 240, placeholder: '多行文本…' });
      const passwordField = new W.UIPasswordField({
        id: 'password',
        left: 300,
        top: 1082,
        width: 200,
        value: 'secret123',
        showToggle: true,
      });
      const rangeSegmented = new W.UISegmented({
        id: 'range',
        left: 524,
        top: 1082,
        width: 240,
        value: 'week',
        options: [
          { value: 'day', label: '日' },
          { value: 'week', label: '周' },
          { value: 'month', label: '月', disabled: true },
        ],
        onChange: (value) => console.log('segmented ->', value),
      });
      const emptyState = new W.UIEmpty({
        id: 'empty',
        left: 788,
        top: 1050,
        width: 200,
        height: 130,
        description: '暂无数据',
        actionText: '新建',
      });
      const skeleton = new W.UISkeleton({
        id: 'skeleton',
        left: 1010,
        top: 1060,
        width: 320,
        rows: 3,
        title: true,
        avatar: true,
        active: true,
      });

      // 数据展示：折叠面板 / 描述列表 / 时间线
      const collapsePanel = new W.UICollapse({
        id: 'collapse',
        left: 32,
        top: 1256,
        width: 280,
        activeKeys: ['a'],
        items: [
          { key: 'a', title: '面板 A', content: 'A 的内容（点标题切换）' },
          { key: 'b', title: '面板 B', content: 'B 的内容' },
        ],
      });
      const descriptions = new W.UIDescriptions({
        id: 'descriptions',
        left: 340,
        top: 1256,
        width: 330,
        column: 2,
        items: [
          { label: '订单号', value: '#10321' },
          { label: '状态', value: '已支付' },
          { label: '客户', value: 'Ava Thompson' },
          { label: '金额', value: '$1,240.00' },
        ],
      });
      const timeline = new W.UITimeline({
        id: 'timeline',
        left: 700,
        top: 1256,
        width: 320,
        items: [
          { title: '创建订单', description: '用户下单', time: '09:01' },
          { title: '支付完成', description: '微信支付', time: '09:03' },
          { title: '已发货', time: '10:20', color: theme.colors.success },
        ],
      });

      // 反馈与状态：加载指示器 / 评分 / 步骤条 / 结果页
      const spin = new W.UISpin({ id: 'spin', left: 32, top: 1540, size: 24, tip: '加载中…' });
      const rate = new W.UIRate({
        id: 'rate',
        left: 200,
        top: 1540,
        count: 5,
        value: 3,
        onChange: (value) => console.log('rate ->', value),
      });
      const steps = new W.UISteps({
        id: 'steps',
        left: 386,
        top: 1532,
        width: 400,
        current: 1,
        items: [{ title: '填写信息' }, { title: '确认订单', description: '核对商品' }, { title: '完成' }],
      });
      const result = new W.UIResult({
        id: 'result',
        left: 780,
        top: 1520,
        width: 260,
        height: 150,
        status: 'success',
        title: '提交成功',
        subtitle: '我们会在 1 个工作日内联系你',
        actions: [{ key: 'ok', text: '返回首页', primary: true }],
      });

      // 高级录入：数字步进框 / 自动完成
      const inputsLabel = new W.UILabel({
        left: 1060,
        top: 1226,
        text: 'Inputs',
        style: { fontSize: 13, fontWeight: '600', fillStyle: theme.colors.text },
      });
      const quantity = new W.UIInputNumber({
        id: 'quantity',
        left: 1060,
        top: 1256,
        width: 140,
        value: 3,
        min: 1,
        max: 10,
        step: 1,
      });
      const cityAuto = new W.UIAutoComplete({
        id: 'city-auto',
        left: 1060,
        top: 1310,
        width: 220,
        placeholder: '输入城市名…',
        options: ['杭州', '上海', '深圳', '北京', '广州', '成都'],
      });

      const treeSelectHint = new W.UILabel({
        left: 1300,
        top: 1232,
        text: '未选择',
        style: { fontSize: 12, fillStyle: theme.colors.textSecondary },
      });
      const dataTreeSelect = new W.UITreeSelect({
        id: 'tree-select',
        left: 1060,
        top: 1364,
        width: 220,
        placeholder: '选择数据源…',
        defaultExpandAll: true,
        nodes: [
          {
            key: 'db',
            label: '数据库',
            children: [
              { key: 'mysql', label: 'MySQL' },
              { key: 'pg', label: 'PostgreSQL' },
            ],
          },
          { key: 'cache', label: '缓存' },
        ],
        onChange: (key, node) => treeSelectHint.setText('已选：' + node.label),
      });

      const datePickerHint = new W.UILabel({
        left: 1250,
        top: 1412,
        text: '未选择日期',
        style: { fontSize: 12, fillStyle: theme.colors.textSecondary },
      });
      const datePicker = new W.UIDatePicker({
        id: 'date-picker',
        left: 1060,
        top: 1406,
        width: 180,
        placeholder: '选择日期…',
        value: '2026-09-12',
        onChange: (value) => datePickerHint.setText('已选：' + value),
      });

      const timeHint = new W.UILabel({
        left: 1240,
        top: 1462,
        text: '未选择时间',
        style: { fontSize: 12, fillStyle: theme.colors.textSecondary },
      });
      const timePicker = new W.UITimePicker({
        id: 'time-picker',
        left: 1060,
        top: 1454,
        width: 160,
        placeholder: '选择时间…',
        value: '09:30:00',
        onChange: (value) => timeHint.setText('已选：' + value),
      });

      const cascader = new W.UICascader({
        id: 'cascader',
        left: 1060,
        top: 1502,
        width: 220,
        placeholder: '选择地区…',
        value: 'xh',
        separator: ' / ',
        options: [
          {
            value: 'zj',
            label: '浙江',
            children: [
              {
                value: 'hz',
                label: '杭州',
                children: [
                  { value: 'xh', label: '西湖' },
                  { value: 'yh', label: '余杭' },
                ],
              },
              { value: 'nb', label: '宁波' },
            ],
          },
          {
            value: 'js',
            label: '江苏',
            children: [
              { value: 'nj', label: '南京' },
              { value: 'sz', label: '苏州' },
            ],
          },
          { value: 'other', label: '其它（禁用）', disabled: true },
        ],
        onChange: (value, path) => console.log('cascader ->', value, path.map((n) => n.label).join('/')),
      });

      // 穿梭框：勾选后用中间按钮在「待选 / 已选」之间搬运
      const transfer = new W.UITransfer({
        id: 'transfer',
        left: 880,
        top: 140,
        width: 420,
        height: 240,
        dataSource: [
          { key: 'apple', title: '苹果' },
          { key: 'banana', title: '香蕉' },
          { key: 'cherry', title: '樱桃' },
          { key: 'durian', title: '榴莲', disabled: true },
          { key: 'elder', title: '接骨木' },
        ],
        targetKeys: ['banana'],
        titles: ['待选', '已选'],
        onChange: (keys, direction, moveKeys) =>
          console.log('transfer ->', direction, moveKeys.join(','), '=>', keys.join(',')),
      });

      // 轮播：裁剪视口 + 横向轨道 + 箭头/圆点（切换带补间过渡）
      const makeSlide = (text, bg) => {
        const slide = new W.UIComponent({
          width: 320,
          height: 180,
          radius: theme.radius.md,
          fill: true,
          stroke: false,
          style: { fillStyle: bg },
        });
        slide.addChild(
          new W.UILabel({
            interactive: false,
            left: 0,
            top: 0,
            width: 320,
            height: 180,
            align: 'center',
            verticalAlign: 'middle',
            text,
            style: { fontSize: 18, fontWeight: '600', fillStyle: '#ffffff' },
          }),
          false,
        );
        return slide;
      };
      const carousel = new W.UICarousel({
        id: 'carousel',
        left: 360,
        top: 900,
        width: 320,
        height: 180,
        slides: [
          makeSlide('1 / 3', theme.colors.primary),
          makeSlide('2 / 3', theme.colors.success),
          makeSlide('3 / 3', theme.colors.warning),
        ],
        onChange: (index) => console.log('carousel ->', index),
      });

      // 组件补全：头像组（重叠 + 折叠 +N）与可关闭提示条
      const avatarGroup = new W.UIAvatarGroup({
        id: 'avatar-group',
        left: 360,
        top: 262,
        size: 32,
        max: 4,
        overlap: 10,
        avatars: [
          { text: 'A' },
          { text: 'B', backgroundColor: theme.colors.success },
          { text: 'C', backgroundColor: theme.colors.warning },
          { text: 'D', backgroundColor: theme.colors.error },
          { text: 'E', backgroundColor: theme.colors.info },
          { text: 'F' },
        ],
      });
      const closableAlert = new W.UIAlert({
        id: 'closable-alert',
        left: 360,
        top: 1150,
        width: 420,
        height: 56,
        type: 'success',
        title: '发布成功',
        message: '右侧 ✕ 可关闭这条提示。',
        closable: true,
        onClose: () => console.log('alert closed'),
      });

      // 评论区（含嵌套回复与操作）
      const comment = new W.UIComment({
        id: 'comment',
        left: 32,
        top: 1730,
        width: 460,
        author: '张三',
        avatarText: '张',
        time: '2 小时前',
        content: '这条评论用于验证嵌套回复与操作按钮。',
        actions: [
          { key: 'reply', text: '回复' },
          { key: 'like', text: '点赞' },
        ],
        replies: [{ author: '李四', content: '同意，我也这么觉得。', time: '1 小时前' }],
      });

      // 颜色选择器：色板网格 + 选中环（表单控件语义）
      const colorHint = new W.UILabel({
        left: 542,
        top: 1856,
        text: '已选：#1677ff',
        style: { fontSize: 12, fillStyle: theme.colors.textSecondary },
      });
      const colorPicker = new W.UIColorPicker({
        id: 'color-picker',
        left: 540,
        top: 1740,
        width: 300,
        columns: 6,
        value: '#1677ff',
        colors: [
          '#1677ff',
          '#13c2c2',
          '#52c41a',
          '#faad14',
          '#fa541c',
          '#f5222d',
          '#eb2f96',
          '#722ed1',
          '#2f54eb',
          '#8c8c8c',
          '#000000',
          '#ffffff',
        ],
        onChange: (color) => colorHint.setText('已选：' + color),
      });

      // 图片：fill / contain / cover 三种适配（240x120 源图放进 120x90 盒子）
      const demoImageSrc =
        'data:image/svg+xml;utf8,' +
        encodeURIComponent(
          "<svg xmlns='http://www.w3.org/2000/svg' width='240' height='120'>" +
            "<rect width='240' height='120' fill='#e6f4ff'/>" +
            "<circle cx='48' cy='60' r='34' fill='#1677ff'/>" +
            "<rect x='110' y='18' width='112' height='84' rx='12' fill='#52c41a'/>" +
            "<text x='132' y='68' font-size='18' fill='#ffffff'>240x120</text>" +
            '</svg>',
        );
      const imageFill = new W.UIImage({
        id: 'image-fill',
        left: 900,
        top: 1740,
        width: 120,
        height: 90,
        fit: 'fill',
        src: demoImageSrc,
      });
      const imageContain = new W.UIImage({
        id: 'image-contain',
        left: 1040,
        top: 1740,
        width: 120,
        height: 90,
        fit: 'contain',
        src: demoImageSrc,
      });
      const imageCover = new W.UIImage({
        id: 'image-cover',
        left: 1180,
        top: 1740,
        width: 120,
        height: 90,
        fit: 'cover',
        src: demoImageSrc,
      });

      panel.addChildren([
        heading('Buttons', 32, 28),

        new W.UIButton({ id: 'btn-primary', left: 32, top: 64, text: 'Primary', width: 96 }),
        new W.UIButton({ id: 'btn-default', left: 140, top: 64, text: 'Default', width: 96, variant: 'default' }),
        new W.UIButton({ id: 'btn-text', left: 248, top: 64, text: 'Text', width: 72, variant: 'text' }),
