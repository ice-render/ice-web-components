<!DOCTYPE html>
<html lang="en">
  <meta charset="utf-8" />
  <title>ice-web-components gallery</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8f9fa;
      color: #212529;
    }
    canvas {
      display: block;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
    }
  </style>
  <body>
    <h1 style="font-size: 20px; margin: 0 0 4px">ice-web-components gallery</h1>
    <p style="margin: 0 0 16px; color: #6c757d">Canvas-native, Swing-style ICE components</p>
    <canvas id="canvas" width="1400" height="1960"></canvas>

    <script src="../node_modules/ice-render/dist/index.umd.js"></script>
    <script src="../dist/index.umd.js"></script>
    <script>
      const ice = new ICE.ICE().init('canvas');
      const W = ICEWEB;
      const theme = W.iceUIManager.getTheme();
      new W.ICEHoverManager(ice).start();
      W.getICEFocusManager(ice).start();

      const heading = (text, left, top) =>
        new W.ICELabel({
          left,
          top,
          text,
          style: {
            fontSize: 15,
            fontWeight: '600',
            fillStyle: theme.colors.text,
          },
        });

      const caption = (text, left, top) =>
        new W.ICELabel({ left, top, text, style: { fontSize: 12, fillStyle: theme.colors.textSecondary } });

      /**
       * 极简流式布局：把每个演示（cluster = 一组必须放在一起的组件）摆进面板。
       *
       * - cluster **内部保持相对位置不变**（作者按局部坐标写，整体平移即可），
       *   所以「输入框 + 它的提示文字」「图片 + 图注」这类组合不会被打散；
       * - 一行放不下就换行，行内**垂直居中**（高矮不一的按钮不会被顶歪）；
       * - 每个 section 自带小标题；面板高度按内容算，不用再手工找空位。
       *
       * 之前靠手写绝对坐标排 60+ 个演示，结果是「新演示只能塞进缝里」，最后出现交叠。
       */
      const flowSections = (panel, sections, options = {}) => {
        const padX = options.padX ?? 28;
        const padTop = options.padTop ?? 24;
        const padBottom = options.padBottom ?? 26;
        const gapX = options.gapX ?? 20;
        const gapY = options.gapY ?? 14;
        const headingHeight = options.headingHeight ?? 20;
        const headingGap = options.headingGap ?? 10;
        const sectionGap = options.sectionGap ?? 22;
        const width = Number(panel.state.width) || 0;
        const avail = width - padX * 2;
        // 幂等：允许重复调用（首帧渲染后再跑一次，让「渲染时才定高」的组件拿到真实尺寸）。
        // 标题只创建一次；已在面板里的节点不再重复 addChild（否则会重复挂载）。
        const attach = (node) => {
          if (node.parentNode !== panel) panel.addChild(node, false);
        };

        // 量一个 cluster 的包围盒：**含后代**（例如 ICESpin 右侧的 tip 文字），
        // 但遇到 clipChildren 容器就以它自身为界（否则轮播里排在屏外的幻灯片会撑爆宽度）。
        const measure = (cluster) => {
          let l = Infinity;
          let t = Infinity;
          let r = -Infinity;
          let b = -Infinity;
          const visit = (node, dx, dy) => {
            const x = dx + (Number(node.state.left) || 0);
            const y = dy + (Number(node.state.top) || 0);
            const w = Number(node.state.width) || 0;
            const h = Number(node.state.height) || 0;
            l = Math.min(l, x);
            t = Math.min(t, y);
            r = Math.max(r, x + w);
            b = Math.max(b, y + h);
            if (node.state.clipChildren) return;
            (node.childNodes || []).forEach((child) => {
              if (child.state && child.state.display !== false) visit(child, x, y);
            });
          };
          cluster.forEach((node) => visit(node, 0, 0));
          return { l, t, w: r - l, h: b - t };
        };
        const shift = (cluster, dx, dy) =>
          cluster.forEach((node) =>
            node.setState({ left: (Number(node.state.left) || 0) + dx, top: (Number(node.state.top) || 0) + dy }),
          );

        // ① 组行
        const lines = [];
        sections.forEach((section, index) => {
          if (section.title) lines.push({ kind: 'heading', section, title: section.title, first: index === 0 });
          // 货架式排放（first-fit）：优先回填到「还放得下」的上一行，
          // 而不是一味往后换行 —— 否则小徽标/小按钮会把页面撑得极高。
          const shelves = [];
          section.items.forEach((entry) => {
            const cluster = Array.isArray(entry) ? entry : [entry];
            const m = measure(cluster);
            // +0.5 容差：宽度刚好铺满时（浮点误差）不该换行
            let shelf = shelves.find((s) => s.used + m.w <= avail + 0.5);
            if (!shelf) {
              shelf = { used: 0, h: 0, items: [] };
              shelves.push(shelf);
            }
            shelf.items.push({ cluster, m });
            shelf.used += m.w + gapX;
            shelf.h = Math.max(shelf.h, m.h);
          });
          shelves.forEach((shelf) => lines.push({ kind: 'row', row: shelf.items, h: shelf.h }));
        });
        lines.forEach((line) => {
          if (line.h === undefined) line.h = headingHeight;
        });

        // ② 落位
        let y = padTop;
        lines.forEach((line, index) => {
          if (line.kind === 'heading') {
            if (index > 0) y += sectionGap;
            // 标题缓存在 section 上（lines 每次调用都会重建，缓存在行上会重复创建标题）
            const title = line.section.__heading || (line.section.__heading = heading(line.title, 0, 0));
            title.setState({ left: padX, top: y, width: avail, height: headingHeight });
            attach(title);
            y += line.h + headingGap;
            return;
          }
          let x = padX;
          line.row.forEach((entry) => {
            const dy = y + Math.max(0, (line.h - entry.m.h) / 2);
            shift(entry.cluster, x - entry.m.l, dy - entry.m.t);
            entry.cluster.forEach(attach);
            x += entry.m.w + gapX;
          });
          y += line.h + gapY;
        });
        const height = y - gapY + padBottom;
        panel.setState({ height });
        return height;
      };

      const panel = new W.ICEPanel({ id: 'panel', left: 24, top: 24, width: 1352, height: 1912 });

      // 滚动视口演示：内容比视口高，靠引擎的 clipChildren 裁掉溢出部分
      // 注意：容器要先创建、再加子组件（引擎按全局 zIndex 排序渲染）
      const scrollPane = new W.ICEScrollPane({ id: 'scroll-pane', left: 32, top: 736, width: 300, height: 96 });
      const scrollContent = new W.ICEWidget({ width: 268, height: 264 });
      for (let i = 0; i < 12; i++) {
        const row = new W.ICEPanel({
          left: 0,
          top: i * 22,
          width: 268,
          height: 20,
          radius: 4,
          style: {
            fillStyle: i % 2 ? theme.colors.background : theme.colors.surface,
            strokeStyle: theme.colors.border,
          },
        });
        row.addChild(new W.ICELabel({ left: 8, top: 3, text: 'Row #' + (i + 1), style: { fontSize: 12 } }), false);
        scrollContent.addChild(row, false);
      }
      scrollPane.setContent(scrollContent);

      // 表单演示：必填校验 + 提交反馈
      const form = new W.ICEForm({ left: 420, top: 656, width: 320, gap: 12 });
      const nameInput = new W.ICETextField({ width: 240, height: 32, placeholder: 'Your name' });
      const agreeBox = new W.ICECheckBox({ width: 24, height: 24 });
      form.addItems([
        new W.ICEFormItem({
          name: 'name',
          label: 'Name',
          control: nameInput,
          // 同步必填 + 异步唯一性（"admin" 视为已占用；异步校验只在提交时触发）
          rules: [
            { required: true },
            {
              asyncValidator: (value) =>
                new Promise((resolve) =>
                  setTimeout(() => resolve(value === 'admin' ? '名字已被占用' : null), 400),
                ),
            },
          ],
        }),
        new W.ICEFormItem({
          name: 'agree',
          label: 'Agree to terms',
          control: agreeBox,
          rules: [{ required: true, message: '请先同意条款' }],
        }),
      ]);
      const submitTop = 656 + form.state.height + 10;
      const submitButton = new W.ICEButton({ left: 420, top: submitTop, width: 120, height: 32, text: 'Submit' });
      const submitHint = new W.ICELabel({
        left: 552,
        top: submitTop + 8,
        text: '',
        style: { fontSize: 12, fillStyle: theme.colors.success },
      });
      submitButton.on('click', () => {
        submitHint.setText('校验中…');
        form.submitAsync().then((ok) => submitHint.setText(ok ? 'Submitted ✓' : ''));
      });

      // 反馈类组件演示：Tooltip（悬停）/ Popover（点击）/ Popconfirm（危险确认）
      const tipTarget = new W.ICEButton({ id: 'tip-btn', left: 820, top: 656, width: 110, height: 32, text: 'Hover me' });
      W.attachTooltip(ice, tipTarget, { title: '这是工具提示', placement: 'top' });

      const popoverTarget = new W.ICEButton({
        id: 'pop-btn',
        left: 946,
        top: 656,
        width: 148,
        height: 32,
        text: 'Show popover',
        variant: 'default',
      });
      W.attachPopover(ice, popoverTarget, { title: '浮层标题', content: '点击外部关闭' });

      const deleteTarget = new W.ICEButton({ id: 'del-btn', left: 820, top: 700, width: 140, height: 32, text: 'Delete', danger: true });
      const deleteHint = new W.ICELabel({
        left: 974,
        top: 708,
        text: '',
        style: { fontSize: 12, fillStyle: theme.colors.success },
      });
      const messageTarget = new W.ICEButton({ id: 'msg-btn', left: 820, top: 744, width: 148, height: 32, text: 'Show message' });
      messageTarget.on('click', () => {
        W.ICEMessage.success(ice, '已保存');
        W.ICEMessage.info(ice, '正在同步数据');
      });
      const notifyTarget = new W.ICEButton({
        id: 'notify-btn',
        left: 974,
        top: 744,
        width: 140,
        height: 32,
        text: 'Notify',
        variant: 'default',
      });
      notifyTarget.on('click', () => {
        W.ICENotification.open(ice, { title: '部署完成', description: 'v1.4.0 已上线' });
      });

      const modalTarget = new W.ICEButton({ id: 'modal-btn', left: 1106, top: 656, width: 130, height: 32, text: 'Open modal' });
      const modalHint = new W.ICELabel({
        left: 1106,
        top: 708,
        text: '',
        style: { fontSize: 12, fillStyle: theme.colors.success },
      });
      const modal = new W.ICEModal(ice, {
        title: '确认发布？',
        content: '发布后所有用户立即可见。',
        width: 380,
        onConfirm: () => modalHint.setText('已发布 ✓'),
      });
      modalTarget.on('click', () => modal.open());

      W.attachPopconfirm(ice, deleteTarget, {
        title: '确认删除？',
        description: '删除后不可恢复',
        danger: true,
        onConfirm: () => deleteHint.setText('已删除 ✓'),
      });

      const pageHint = new W.ICELabel({
        left: 820,
        top: 776,
        text: '第 1 页 / 每页 10 条',
        style: { fontSize: 12, fillStyle: theme.colors.textSecondary },
      });
      const pagination = new W.ICEPagination({
        id: 'pagination',
        left: 820,
        top: 800,
        width: 420,
        total: 238,
        pageSize: 10,
        showTotal: true,
        showSizeChanger: true,
        onChange: (page, pageSize) => pageHint.setText(`第 ${page} 页 / 每页 ${pageSize} 条`),
      });

      // 选择器演示：单选 + 搜索（放在 Feedback 区下方）
      const cityHint = new W.ICELabel({
        left: 1106,
        top: 776,
        text: '未选择城市',
        style: { fontSize: 12, fillStyle: theme.colors.textSecondary },
      });
      const citySelect = new W.ICESelect({
        id: 'city-select',
        left: 1106,
        top: 800,
        width: 180,
        height: 32,
        placeholder: '请选择城市',
        showSearch: true,
        options: [
          { value: 'hangzhou', label: '杭州' },
          { value: 'shanghai', label: '上海' },
          { value: 'shenzhen', label: '深圳', disabled: true },
          { value: 'beijing', label: '北京' },
        ],
        onChange: (value, option) => cityHint.setText('已选择：' + option.label),
      });

      const drawerTarget = new W.ICEButton({ id: 'drawer-btn', left: 1120, top: 744, width: 130, height: 32, text: 'Open drawer' });
      const drawer = new W.ICEDrawer(ice, {
        title: '抽屉',
        content: '从右侧滑入，点遮罩或 ✕ 关闭。',
        width: 300,
      });
      drawerTarget.on('click', () => drawer.open());

      // 列表演示：多选 + 内部滚动（内容超出高度时自动套 ICEScrollPane）
      const listHint = new W.ICELabel({
        left: 820,
        top: 828,
        text: '未选择',
        style: { fontSize: 12, fillStyle: theme.colors.textSecondary },
      });
      const cityList = new W.ICEList({
        id: 'city-list',
        left: 820,
        top: 860,
        width: 300,
        height: 120,
        mode: 'multiple',
        itemHeight: 36,
        items: [
          { key: 'a', label: '苹果' },
          { key: 'b', label: '香蕉' },
          { key: 'c', label: '橙子', disabled: true },
          { key: 'd', label: '葡萄' },
          { key: 'e', label: '西瓜' },
          { key: 'f', label: '草莓' },
        ],
        onChange: (keys) => listHint.setText(keys.length ? '已选：' + keys.join('、') : '未选择'),
      });

      // 树演示：两级结构 + 展开/折叠 + 单选
      const treeHint = new W.ICELabel({
        left: 1140,
        top: 828,
        text: '未选择节点',
        style: { fontSize: 12, fillStyle: theme.colors.textSecondary },
      });
      const tree = new W.ICETree({
        id: 'tree',
        left: 1140,
        top: 856,
        width: 200,
        height: 150,
        defaultExpandAll: true,
        nodes: [
          {
            key: 'root',
            label: '数据源',
            children: [
              { key: 'mysql', label: 'MySQL' },
              { key: 'pg', label: 'PostgreSQL' },
              { key: 'cache', label: '缓存', children: [{ key: 'redis', label: 'Redis' }] },
            ],
          },
          { key: 'logs', label: '日志' },
        ],
        onSelect: (keys, node) => treeHint.setText(node ? '已选择：' + node.label : '未选择节点'),
      });

      // 更多输入与状态：多行文本框 / 密码框 / 分段控制器 / 空状态 / 骨架屏
      const bioArea = new W.ICETextArea({ id: 'bio', left: 32, top: 1066, width: 240, placeholder: '多行文本…' });
      const passwordField = new W.ICEPasswordField({
        id: 'password',
        left: 300,
        top: 1082,
        width: 200,
        value: 'secret123',
        showToggle: true,
      });
      const rangeSegmented = new W.ICESegmented({
        id: 'range',
        left: 524,
        top: 1082,
        width: 240,
        value: 'week',
        options: [
          { value: 'day', label: '日' },
          { value: 'week', label: '周' },
          { value: 'month', label: '月', disabled: true },
        ],
        onChange: (value) => console.log('segmented ->', value),
      });
      const emptyState = new W.ICEEmpty({
        id: 'empty',
        left: 788,
        top: 1050,
        width: 200,
        height: 130,
        description: '暂无数据',
        actionText: '新建',
      });
      const skeleton = new W.ICESkeleton({
        id: 'skeleton',
        left: 1010,
        top: 1060,
        width: 320,
        rows: 3,
        title: true,
        avatar: true,
        active: true,
      });

      // 数据展示：折叠面板 / 描述列表 / 时间线
      const collapsePanel = new W.ICECollapse({
        id: 'collapse',
        left: 32,
        top: 1256,
        width: 280,
        activeKeys: ['a'],
        items: [
          { key: 'a', title: '面板 A', content: 'A 的内容（点标题切换）' },
          { key: 'b', title: '面板 B', content: 'B 的内容' },
        ],
      });
      const descriptions = new W.ICEDescriptions({
        id: 'descriptions',
        left: 340,
        top: 1256,
        width: 330,
        column: 2,
        items: [
          { label: '订单号', value: '#10321' },
          { label: '状态', value: '已支付' },
          { label: '客户', value: 'Ava Thompson' },
          { label: '金额', value: '$1,240.00' },
        ],
      });
      const timeline = new W.ICETimeline({
        id: 'timeline',
        left: 700,
        top: 1256,
        width: 320,
        items: [
          { title: '创建订单', description: '用户下单', time: '09:01' },
          { title: '支付完成', description: '微信支付', time: '09:03' },
          { title: '已发货', time: '10:20', color: theme.colors.success },
        ],
      });

      // 反馈与状态：加载指示器 / 评分 / 步骤条 / 结果页
      const spin = new W.ICESpin({ id: 'spin', left: 32, top: 1540, size: 24, tip: '加载中…' });
      const rate = new W.ICERate({
        id: 'rate',
        left: 200,
        top: 1540,
        count: 5,
        value: 3,
        onChange: (value) => console.log('rate ->', value),
      });
      const steps = new W.ICESteps({
        id: 'steps',
        left: 386,
        top: 1532,
        width: 400,
        current: 1,
        items: [{ title: '填写信息' }, { title: '确认订单', description: '核对商品' }, { title: '完成' }],
      });
      const result = new W.ICEResult({
        id: 'result',
        left: 780,
        top: 1520,
        width: 260,
        height: 150,
        status: 'success',
        title: '提交成功',
        subtitle: '我们会在 1 个工作日内联系你',
        actions: [{ key: 'ok', text: '返回首页', primary: true }],

      // 高级录入：数字步进框 / 自动完成
      const quantity = new W.ICEInputNumber({
        id: 'quantity',
        left: 1060,
        top: 1256,
        width: 140,
        value: 3,
        min: 1,
        max: 10,
        step: 1,
      });
      const cityAuto = new W.ICEAutoComplete({
        id: 'city-auto',
        left: 1060,
        top: 1310,
        width: 220,
        placeholder: '输入城市名…',
        options: ['杭州', '上海', '深圳', '北京', '广州', '成都'],
      });

      const treeSelectHint = new W.ICELabel({
        left: 1300,
        top: 1232,
        text: '未选择',
        style: { fontSize: 12, fillStyle: theme.colors.textSecondary },

      const dataTreeSelect = new W.ICETreeSelect({
        id: 'tree-select',
        left: 1060,
        top: 1364,
        width: 220,
        placeholder: '选择数据源…',
        defaultExpandAll: true,

            children: [

              { key: 'pg', label: 'PostgreSQL' },
            ],

        onChange: (key, node) => treeSelectHint.setText('已选：' + node.label),

      const datePickerHint = new W.ICELabel({
        left: 1250,
        top: 1412,
        text: '未选择日期',
        style: { fontSize: 12, fillStyle: theme.colors.textSecondary },
      });
      const datePicker = new W.ICEDatePicker({
        id: 'date-picker',
        left: 1060,
        top: 1406,
        width: 180,
        placeholder: '选择日期…',
        value: '2026-09-12',
        onChange: (value) => datePickerHint.setText('已选：' + value),
      });

      const timeHint = new W.ICELabel({
        left: 1240,
        top: 1462,
        text: '未选择时间',
        style: { fontSize: 12, fillStyle: theme.colors.textSecondary },
      });
      const timePicker = new W.ICETimePicker({
        id: 'time-picker',
        left: 1060,
        top: 1454,
        width: 160,
        placeholder: '选择时间…',
        value: '09:30:00',
        onChange: (value) => timeHint.setText('已选：' + value),
      });

      const cascader = new W.ICECascader({
        id: 'cascader',
        left: 1060,
        top: 1502,
        width: 220,
        placeholder: '选择地区…',
        value: 'xh',
        separator: ' / ',
        options: [
          {
            value: 'zj',
            label: '浙江',
            children: [
              {
                value: 'hz',
                label: '杭州',
                children: [
                  { value: 'xh', label: '西湖' },
                  { value: 'yh', label: '余杭' },
                ],
              },
              { value: 'nb', label: '宁波' },
            ],
          },
          {
            value: 'js',
            label: '江苏',
            children: [
              { value: 'nj', label: '南京' },
              { value: 'sz', label: '苏州' },
            ],

        onChange: (value, path) => console.log('cascader ->', value, path.map((n) => n.label).join('/')),
      });

      // 穿梭框：勾选后用中间按钮在「待选 / 已选」之间搬运
      const transfer = new W.ICETransfer({
        id: 'transfer',
        left: 880,
        top: 140,
        width: 420,
        height: 240,
        dataSource: [
          { key: 'apple', title: '苹果' },
          { key: 'banana', title: '香蕉' },
          { key: 'cherry', title: '樱桃' },
          { key: 'durian', title: '榴莲', disabled: true },
          { key: 'elder', title: '接骨木' },
        ],
        targetKeys: ['banana'],
        titles: ['待选', '已选'],
        onChange: (keys, direction, moveKeys) =>
