<!DOCTYPE html>
<html lang="en">
  <meta charset="utf-8" />
  <title>ice-web-components gallery</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8f9fa;
      color: #212529;
    }
    canvas {
      display: block;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.15);
    }
  </style>
  <body>
    <h1 style="font-size: 20px; margin: 0 0 4px">ice-web-components gallery</h1>
    <p style="margin: 0 0 16px; color: #6c757d">Canvas-native, Swing-style ICE components</p>
    <canvas id="canvas" width="1400" height="1960"></canvas>

    <script src="../node_modules/ice-render/dist/index.umd.js"></script>
    <script src="../dist/index.umd.js"></script>
    <script>
      const ice = new ICE.ICE().init('canvas');
      const W = ICEWEB;
      const theme = W.iceUIManager.getTheme();
      new W.ICEHoverManager(ice).start();
      W.getICEFocusManager(ice).start();

      const heading = (text, left, top) =>
        new W.ICELabel({
          left,
          top,
          text,
          style: {
            fontSize: 15,
            fontWeight: '600',
            fillStyle: ICE.token('ui.colors.text'),
          },
        });

      const caption = (text, left, top) =>
        new W.ICELabel({ left, top, text, style: { fontSize: 12, fillStyle: ICE.token('ui.colors.textSecondary') } });

      /**
       * 极简流式布局：把每个演示（cluster = 一组必须放在一起的组件）摆进面板。
       *
       * - cluster **内部保持相对位置不变**（作者按局部坐标写，整体平移即可），
       *   所以「输入框 + 它的提示文字」「图片 + 图注」这类组合不会被打散；
       * - 一行放不下就换行，行内**垂直居中**（高矮不一的按钮不会被顶歪）；
       * - 每个 section 自带小标题；面板高度按内容算，不用再手工找空位。
       *
       * 之前靠手写绝对坐标排 60+ 个演示，结果是「新演示只能塞进缝里」，最后出现交叠。
       */
      /**
       * 版块流式排布（簇 + 货架）。
       *
       * **排布已交给引擎的布局器**（2026-09-15 起）：
       * - `panel` → `ICEBoxLayout(axis: 'y')`：版块纵向堆叠（间距 = sectionGap）；
       * - 每个版块 → `ICEBoxLayout(axis: 'y')`：标题一行 + 簇区一行（间距 = headingGap）；
       * - 簇区 → `ICEFlowLayout({ pack: 'first-fit', crossAlign: 'center', gap, gapY })`：
       *   簇从左到右排、放不下换行，**小簇优先回填到还放得下的上一行**（first-fit）——
       *   这正是原先手写"货架"的逻辑，现在由引擎负责。
       *
       * 本函数只保留两件"引擎不该管"的事：
       * ① **量簇**：簇内成员保持各自的局部坐标（整体平移），所以要算它们的包围盒；
       *    含后代（如 ICESpin 右侧的 tip 文字），但遇到 `clipChildren` 容器以它自身为界
       *    （否则轮播里排在屏外的幻灯片会把宽度撑爆）。
       * ② 把量到的簇尺寸写回簇容器，然后 `panel.doLayout()` 让引擎排。
       *
       * 幂等：允许重复调用（首帧渲染后再跑一次，让"渲染时才定高"的组件拿到真实尺寸）。
       */
      const flowSections = (panel, sections, options = {}) => {
        const padX = options.padX ?? 28;
        const padTop = options.padTop ?? 24;
        const padBottom = options.padBottom ?? 26;
        const gapX = options.gapX ?? 20;
        const gapY = options.gapY ?? 14;
        const headingHeight = options.headingHeight ?? 20;
        const headingGap = options.headingGap ?? 10;
        const sectionGap = options.sectionGap ?? 22;
        const width = Number(panel.state.width) || 0;
        const avail = width - padX * 2;

        const ICE = window.ICE;
        const W = window.ICEWEB;
        const strip = (props) => new W.ICEWidget(Object.assign({ fill: false, stroke: false, interactive: false }, props));

        // ① 面板与版块的布局策略（幂等：重复调用只是再设一次同一个策略）
        panel.setState({ padding: { left: padX, right: padX, top: padTop, bottom: padBottom } });
        panel.setLayout(new ICE.ICEBoxLayout({ axis: 'y', gap: sectionGap }));

        // ② 量簇：含后代，clipChildren 处收边
        const measure = (cluster) => {
          let l = Infinity;
          let t = Infinity;
          let r = -Infinity;
          let b = -Infinity;
          const visit = (node, dx, dy) => {
            const x = dx + (Number(node.state.left) || 0);
            const y = dy + (Number(node.state.top) || 0);
            const w = Number(node.state.width) || 0;
            const h = Number(node.state.height) || 0;
            l = Math.min(l, x);
            t = Math.min(t, y);
            r = Math.max(r, x + w);
            b = Math.max(b, y + h);
            if (node.state.clipChildren) return;
            (node.childNodes || []).forEach((child) => {
              if (child.state && child.state.display !== false) visit(child, x, y);
            });
          };
          cluster.forEach((node) => visit(node, 0, 0));
          return { l, t, w: r - l, h: b - t };
        };

        // ③ 建结构（只建一次）+ 量簇写回尺寸
        sections.forEach((section) => {
          if (!section.__node) {
            const box = strip({ width: avail });
            box.setLayout(new ICE.ICEBoxLayout({ axis: 'y', gap: headingGap }));
            if (section.title) {
              const title = heading(section.title, 0, 0);
              title.setState({ width: avail, height: headingHeight });
              box.addChild(title, false);
            }
            const flowArea = strip({ width: avail, height: 0 });
            flowArea.setLayout(
              new ICE.ICEFlowLayout({ gap: gapX, gapY, crossAlign: 'center', pack: 'first-fit' })
            );
            box.addChild(flowArea, false);
            section.__flowArea = flowArea;
            section.__clusters = [];
            section.items.forEach((entry) => {
              const clusterNodes = Array.isArray(entry) ? entry : [entry];
              const clusterBox = strip({ width: 0, height: 0 });
              clusterNodes.forEach((node) => clusterBox.addChild(node, false));
              flowArea.addChild(clusterBox, false);
              section.__clusters.push({ box: clusterBox, nodes: clusterNodes });
            });
            panel.addChild(box, false);
            section.__node = box;
          }
          // 量簇 → 写回簇容器尺寸（簇内成员保持局部坐标，整体由布局平移）
          section.__clusters.forEach((entry) => {
            const m = measure(entry.nodes);
            entry.box.setState({ width: Math.max(0, m.w), height: Math.max(0, m.h) });
            entry.nodes.forEach((node) =>
              node.setState({
                left: (Number(node.state.left) || 0) - m.l,
                top: (Number(node.state.top) || 0) - m.t,
              })
            );
          });
        });

        // ④ 尺寸协商（自下而上）：簇区高度 = 换行后的行高之和（引擎按它当前宽度算），
        //    版块高度 = 标题 + 间距 + 簇区（BoxLayout 的首选尺寸），面板高度 = 各版块之和。
        sections.forEach((section) => {
          const flowArea = section.__flowArea;
          const box = section.__node;
          if (!flowArea || !box) return;
          flowArea.setState({ height: flowArea.getPreferredSize()[1] });
          box.setState({ height: box.getPreferredSize()[1] });
        });
        const height = Math.max(0, panel.getPreferredSize()[1]) + padBottom;
        panel.setState({ height });
        // ⑤ 交给引擎排（版块纵向 → 标题/簇区 → 簇 first-fit 流式）
        panel.doLayout();
        return height;
      };

      const panel = new W.ICEPanel({ id: 'panel', left: 24, top: 24, width: 1352, height: 1912 });

      // 滚动视口演示：内容比视口高，靠引擎的 clipChildren 裁掉溢出部分
      // 注意：容器要先创建、再加子组件（引擎按全局 zIndex 排序渲染）
      const scrollPane = new W.ICEScrollPane({ id: 'scroll-pane', left: 32, top: 736, width: 300, height: 96 });
      const scrollContent = new W.ICEWidget({ width: 268, height: 264 });
      for (let i = 0; i < 12; i++) {
        const row = new W.ICEPanel({
          left: 0,
          top: i * 22,
          width: 268,
          height: 20,
          radius: 4,
          style: {
            fillStyle: i % 2 ? ICE.token('ui.colors.background') : ICE.token('ui.colors.surface'),
            strokeStyle: ICE.token('ui.colors.border'),
          },
        });
        row.addChild(new W.ICELabel({ left: 8, top: 3, text: 'Row #' + (i + 1), style: { fontSize: 12 } }), false);
        scrollContent.addChild(row, false);
      }
      scrollPane.setContent(scrollContent);

      // 表单演示：必填校验 + 提交反馈
      const form = new W.ICEForm({ left: 420, top: 656, width: 320, gap: 12 });
      const nameInput = new W.ICETextField({ width: 240, height: 32, placeholder: 'Your name' });
      const agreeBox = new W.ICECheckBox({ width: 24, height: 24 });
      form.addItems([
        new W.ICEFormItem({
          name: 'name',
          label: 'Name',
          control: nameInput,
          // 同步必填 + 异步唯一性（"admin" 视为已占用；异步校验只在提交时触发）
          rules: [
            { required: true },
            {
              asyncValidator: (value) =>
                new Promise((resolve) =>
                  setTimeout(() => resolve(value === 'admin' ? '名字已被占用' : null), 400),
                ),
            },
          ],
        }),
        new W.ICEFormItem({
          name: 'agree',
          label: 'Agree to terms',
          control: agreeBox,
          rules: [{ required: true, message: '请先同意条款' }],
        }),
      ]);
      const submitTop = 656 + form.state.height + 10;
      const submitButton = new W.ICEButton({ id: 'submit-button', left: 420, top: submitTop, width: 120, height: 32, text: 'Submit' });
      const submitHint = new W.ICELabel({
        left: 552,
        top: submitTop + 8,
        text: '',
        style: { fontSize: 12, fillStyle: ICE.token('ui.colors.success') },
      });
      submitButton.on('click', () => {
        submitHint.setText('校验中…');
        form.submitAsync().then((ok) => submitHint.setText(ok ? 'Submitted ✓' : ''));
      });

      // 反馈类组件演示：Tooltip（悬停）/ Popover（点击）/ Popconfirm（危险确认）
      const tipTarget = new W.ICEButton({ id: 'tip-btn', left: 820, top: 656, width: 110, height: 32, text: 'Hover me' });
      W.attachTooltip(ice, tipTarget, { title: '这是工具提示', placement: 'top' });

      const popoverTarget = new W.ICEButton({
        id: 'pop-btn',
        left: 946,
        top: 656,
        width: 148,
        height: 32,
        text: 'Show popover',
        variant: 'default',
      });
      W.attachPopover(ice, popoverTarget, { title: '浮层标题', content: '点击外部关闭' });

      const deleteTarget = new W.ICEButton({ id: 'del-btn', left: 820, top: 700, width: 140, height: 32, text: 'Delete', danger: true });
      const deleteHint = new W.ICELabel({
        left: 974,
        top: 708,
        text: '',
        style: { fontSize: 12, fillStyle: ICE.token('ui.colors.success') },
      });
      const messageTarget = new W.ICEButton({ id: 'msg-btn', left: 820, top: 744, width: 148, height: 32, text: 'Show message' });
      messageTarget.on('click', () => {
        W.ICEMessage.success(ice, '已保存');
        W.ICEMessage.info(ice, '正在同步数据');
      });
      const notifyTarget = new W.ICEButton({
        id: 'notify-btn',
        left: 974,
        top: 744,
        width: 140,
        height: 32,
        text: 'Notify',
        variant: 'default',
      });
      notifyTarget.on('click', () => {
        W.ICENotification.open(ice, { title: '部署完成', description: 'v1.4.0 已上线' });
      });

      const modalTarget = new W.ICEButton({ id: 'modal-btn', left: 1106, top: 656, width: 130, height: 32, text: 'Open modal' });
      const modalHint = new W.ICELabel({
        left: 1106,
        top: 708,
        text: '',
        style: { fontSize: 12, fillStyle: ICE.token('ui.colors.success') },
      });
      const modal = new W.ICEModal(ice, {
        title: '确认发布？',
        content: '发布后所有用户立即可见。',
        width: 380,
        onConfirm: () => modalHint.setText('已发布 ✓'),
      });
      modalTarget.on('click', () => modal.open());

      W.attachPopconfirm(ice, deleteTarget, {
        title: '确认删除？',
        description: '删除后不可恢复',
        danger: true,
        onConfirm: () => deleteHint.setText('已删除 ✓'),
      });

      const pageHint = new W.ICELabel({
        left: 820,
        top: 776,
        text: '第 1 页 / 每页 10 条',
        style: { fontSize: 12, fillStyle: ICE.token('ui.colors.textSecondary') },
      });
      const pagination = new W.ICEPagination({
        id: 'pagination',
        left: 820,
        top: 800,
        width: 420,
        total: 238,
        pageSize: 10,
        showTotal: true,
        showSizeChanger: true,
        onChange: (page, pageSize) => pageHint.setText(`第 ${page} 页 / 每页 ${pageSize} 条`),
      });

      // 选择器演示：单选 + 搜索（放在 Feedback 区下方）
      const cityHint = new W.ICELabel({
        left: 1106,
        top: 776,
        text: '未选择城市',
        style: { fontSize: 12, fillStyle: ICE.token('ui.colors.textSecondary') },
      });
      const citySelect = new W.ICESelect({
        id: 'city-select',
        left: 1106,
        top: 800,
        width: 180,
        height: 32,
        placeholder: '请选择城市',
        showSearch: true,
        options: [
          { value: 'hangzhou', label: '杭州' },
          { value: 'shanghai', label: '上海' },
          { value: 'shenzhen', label: '深圳', disabled: true },
          { value: 'beijing', label: '北京' },
        ],
        onChange: (value, option) => cityHint.setText('已选择：' + option.label),
      });

      const drawerTarget = new W.ICEButton({ id: 'drawer-btn', left: 1120, top: 744, width: 130, height: 32, text: 'Open drawer' });
      const drawer = new W.ICEDrawer(ice, {
        title: '抽屉',
        content: '从右侧滑入，点遮罩或 ✕ 关闭。',
        width: 300,
      });
      drawerTarget.on('click', () => drawer.open());

      // 列表演示：多选 + 内部滚动（内容超出高度时自动套 ICEScrollPane）
      const listHint = new W.ICELabel({
        left: 820,
        top: 828,
        text: '未选择',
        style: { fontSize: 12, fillStyle: ICE.token('ui.colors.textSecondary') },
      });
      const cityList = new W.ICEList({
        id: 'city-list',
        left: 820,
        top: 860,
        width: 300,
        height: 120,
        mode: 'multiple',
        itemHeight: 36,
        items: [
          { key: 'a', label: '苹果' },
          { key: 'b', label: '香蕉' },
          { key: 'c', label: '橙子', disabled: true },
          { key: 'd', label: '葡萄' },
          { key: 'e', label: '西瓜' },
          { key: 'f', label: '草莓' },
        ],
        onChange: (keys) => listHint.setText(keys.length ? '已选：' + keys.join('、') : '未选择'),
      });

      // 树演示：两级结构 + 展开/折叠 + 单选
      const treeHint = new W.ICELabel({
        left: 1140,
        top: 828,
        text: '未选择节点',
        style: { fontSize: 12, fillStyle: ICE.token('ui.colors.textSecondary') },
      });
      const tree = new W.ICETree({
        id: 'tree',
        left: 1140,
        top: 856,
        width: 200,
        height: 150,
        defaultExpandAll: true,
        // 节点可拖拽：上 1/3 插前面、中 1/3 放进去、下 1/3 插后面
        draggable: true,
        nodes: [
          {
            key: 'root',
            label: '数据源',
            children: [
              { key: 'mysql', label: 'MySQL' },
              { key: 'pg', label: 'PostgreSQL' },
              { key: 'cache', label: '缓存', children: [{ key: 'redis', label: 'Redis' }] },
            ],
          },
          { key: 'logs', label: '日志' },
        ],
        onSelect: (keys, node) => treeHint.setText(node ? '已选择：' + node.label : '未选择节点'),
      });

      // 更多输入与状态：多行文本框 / 密码框 / 分段控制器 / 空状态 / 骨架屏
      const bioArea = new W.ICETextArea({ id: 'bio', left: 32, top: 1066, width: 240, placeholder: '多行文本…' });
      const passwordField = new W.ICEPasswordField({
        id: 'password',
        left: 300,
        top: 1082,
        width: 200,
        value: 'secret123',
        showToggle: true,
      });
      const rangeSegmented = new W.ICESegmented({
        id: 'range',
        left: 524,
        top: 1082,
        width: 240,
        value: 'week',
        options: [
          { value: 'day', label: '日' },
          { value: 'week', label: '周' },
          { value: 'month', label: '月', disabled: true },
        ],
        onChange: (value) => console.log('segmented ->', value),
      });
      const emptyState = new W.ICEEmpty({
        id: 'empty',
        left: 788,
        top: 1050,
        width: 200,
        height: 130,
        description: '暂无数据',
        actionText: '新建',
      });
      const skeleton = new W.ICESkeleton({
        id: 'skeleton',
        left: 1010,
        top: 1060,
        width: 320,
        rows: 3,
        title: true,
        avatar: true,
        active: true,
      });

      // 数据展示：折叠面板 / 描述列表 / 时间线
      const collapsePanel = new W.ICECollapse({
        id: 'collapse',
        left: 32,
        top: 1256,
        width: 280,
        activeKeys: ['a'],
        items: [
          { key: 'a', title: '面板 A', content: 'A 的内容（点标题切换）' },
          { key: 'b', title: '面板 B', content: 'B 的内容' },

      });
      const descriptions = new W.ICEDescriptions({

        width: 330,
        column: 2,
        items: [
          { label: '订单号', value: '#10321' },
          { label: '状态', value: '已支付' },
          { label: '客户', value: 'Ava Thompson' },
          { label: '金额', value: '$1,240.00' },

      const timeline = new W.ICETimeline({
        id: 'timeline',

        width: 320,

          { title: '创建订单', description: '用户下单', time: '09:01' },

      // 反馈与状态：加载指示器 / 评分 / 步骤条 / 结果页

      const datePickerHint = new W.ICELabel({

      const datePicker = new W.ICEDatePicker({

      const timeHint = new W.ICELabel({
        left: 1240,
        top: 1462,

      });
      const timePicker = new W.ICETimePicker({
        id: 'time-picker',
        left: 1060,

      // 按 id 找节点：**递归**（排布交给布局器后，节点嵌在"版块 → 簇区 → 簇"里，不再是面板的直接子节点）
      const findById = (root, id) => {
        const hit = (root.childNodes || []).find((node) => node.state && node.state.id === id);
        if (hit) return hit;
        for (const child of root.childNodes || []) {
          const found = findById(child, id);
          if (found) return found;
        }
        return undefined;
      };

      // 画布随内容长高：改元素尺寸 + 同步 ice.canvasWidth/Height（渲染器每帧都读它）
      const syncCanvasToContent = (height) => {
        panel.setState({ height });
        const canvasEl = document.getElementById('canvas');
        const nextWidth = Math.round(Number(panel.state.width) + 48);
        const nextHeight = Math.round(height + 48);
        if (canvasEl.width !== nextWidth || canvasEl.height !== nextHeight) {
          canvasEl.width = nextWidth;
          canvasEl.height = nextHeight;
          canvasEl.style.width = nextWidth + 'px';
          canvasEl.style.height = nextHeight + 'px';
        }
        ice.canvasWidth = nextWidth;
        ice.canvasHeight = nextHeight;
        ice.updateCanvasBoundingRect();
        ice.dirty = true;
      };
      syncCanvasToContent(flowSections(panel, sections));

      // 下拉菜单演示：点 Default 弹菜单，选中后触发按钮文字更新
      const defaultButton = findById(panel, 'btn-default');
      const dropdown = W.attachDropdown(ice, defaultButton, {
        items: [
          { key: 'day', label: '按天' },
          { key: 'week', label: '按周' },
          { key: 'month', label: '按月' },
          { key: 'year', label: '按年', disabled: true },

        selectedKey: 'week',
        onSelect: (item) => defaultButton.setText(item.label),
      });


      // 浮层演示：点 Primary 弹出 popover（弹层底座 + 入场缩放/出场淡出）
      const primaryButton = findById(panel, 'btn-primary');
      const makePopover = () => {
        const popover = new W.ICEPanel({ width: 208, height: 84, radius: 8 });
        popover.addChild(
          new W.ICELabel({ left: 12, top: 10, text: 'Popover', style: { fontSize: 13, fontWeight: '600' } }),
        );
        popover.addChild(
          new W.ICELabel({
            left: 12,
            top: 32,
            text: 'Anchored + animated',
            style: { fontSize: 12, fillStyle: ICE.token('ui.colors.textSecondary') },
          }),
        );
        popover.addChild(
          new W.ICELabel({
            left: 12,
            top: 54,
            text: 'Click outside to close',
            style: { fontSize: 12, fillStyle: ICE.token('ui.colors.textTertiary') },
          }),
        );
        return popover;
      };
      primaryButton.on('click', () => {
        const overlays = W.getICEOverlayManager(ice);
        if (overlays.isOpen()) {
          overlays.closeAll();
          return;
        }
        overlays.open({
          anchor: primaryButton,
          content: makePopover(),
          placement: 'bottomLeft',
          enterAnimation: 'scale',
          exitAnimation: 'fade',
        });
      });

      ice.addChild(panel);

      // 首帧渲染后，个别组件（时间轴 / 描述列表）才算出真实高度 —— 再跑一次流式布局抹平误差
      requestAnimationFrame(() =>
        requestAnimationFrame(() => syncCanvasToContent(flowSections(panel, sections))),
      );

      const a11yMirror = W.mountICEAccessibilityMirror(ice, { id: 'gallery-a11y-mirror' });

window.__result = { ice, panel, form, a11yMirror, nameInput, agreeBox, submitButton, submitHint, scrollPane, tipTarget, popoverTarget, deleteTarget, deleteHint, modalTarget, modalHint, modal, pagination, pageHint, dropdown, citySelect, cityHint, drawerTarget, drawer, cityList, listHint, tree, treeHint, bioArea, passwordField, rangeSegmented, emptyState, skeleton, collapsePanel, descriptions, timeline, spin, rate, steps, result, quantity, cityAuto, dataTreeSelect, treeSelectHint, datePicker, datePickerHint, timePicker, timeHint, cascader, transfer, upload, carousel, avatarGroup, closableAlert, progressCircle, progressCircleDone, comment, colorPicker, colorHint, imageFill, imageContain, imageCover, breadcrumb, breadcrumbCollapsed, statistic, countdown, radioGroup, checkboxGroup, splitter, watermark, typographyTitle, typographyParagraph, typographyLink, anchorPane, anchor, backTop, calendar, imagePreview, previewTarget, tour, tourTarget, layoutSpace, layoutGrid, layoutDemo, affixPane, affixBar, svgCheckIcon, svgSearchIcon, fab, pagedTable, crossForm, virtualList, bigTable, kanban };
