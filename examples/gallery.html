<!DOCTYPE html>
<html lang="en">
  <meta charset="utf-8" />
  <title>ice-web-components gallery</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      color: rgba(0, 0, 0, 0.88);
    }
    canvas {
      display: block;
      border-radius: 12px;
      background: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
    }
  </style>
  <body>
    <h1 style="font-size: 20px; margin: 0 0 16px">ice-web-components gallery</h1>
    <canvas id="canvas" width="1400" height="1200"></canvas>

    <script src="../node_modules/ice-render/dist/index.umd.js"></script>
    <script src="../dist/index.umd.js"></script>
    <script>
      const ice = new ICE.ICE().init('canvas');
      const W = ICEWEB;
      const theme = W.uiManager.getTheme();
      new W.UIHoverManager(ice).start();
      W.getUIFocusManager(ice).start();

      const heading = (text, left, top) =>
        new W.UILabel({
          left,
          top,
          text,
          style: {
            fontSize: 15,
            fontWeight: '600',
            fillStyle: theme.colors.text,
          },
        });

      const panel = new W.UIPanel({ id: 'panel', left: 24, top: 24, width: 1352, height: 1152 });

      // 滚动视口演示：内容比视口高，靠引擎的 clipChildren 裁掉溢出部分
      // 注意：容器要先创建、再加子组件（引擎按全局 zIndex 排序渲染）
      const scrollPane = new W.UIScrollPane({ id: 'scroll-pane', left: 32, top: 736, width: 300, height: 96 });
      const scrollContent = new W.UIComponent({ width: 268, height: 264 });
      for (let i = 0; i < 12; i++) {
        const row = new W.UIPanel({
          left: 0,
          top: i * 22,
          width: 268,
          height: 20,
          radius: 4,
          style: {
            fillStyle: i % 2 ? theme.colors.background : theme.colors.surface,
            strokeStyle: theme.colors.border,
          },
        });
        row.addChild(new W.UILabel({ left: 8, top: 3, text: 'Row #' + (i + 1), style: { fontSize: 12 } }), false);
        scrollContent.addChild(row, false);
      }
      scrollPane.setContent(scrollContent);

      // 表单演示：必填校验 + 提交反馈
      const form = new W.UIForm({ left: 420, top: 656, width: 320, gap: 12 });
      const nameInput = new W.UITextField({ width: 240, height: 32, placeholder: 'Your name' });
      const agreeBox = new W.UICheckBox({ width: 24, height: 24 });
      form.addItems([
        new W.UIFormItem({ name: 'name', label: 'Name', control: nameInput, rules: [{ required: true }] }),
        new W.UIFormItem({
          name: 'agree',
          label: 'Agree to terms',
          control: agreeBox,
          rules: [{ required: true, message: '请先同意条款' }],
        }),
      ]);
      const submitTop = 656 + form.state.height + 10;
      const submitButton = new W.UIButton({ left: 420, top: submitTop, width: 120, height: 32, text: 'Submit' });
      const submitHint = new W.UILabel({
        left: 552,
        top: submitTop + 8,
        text: '',
        style: { fontSize: 12, fillStyle: theme.colors.success },
      });
      submitButton.on('click', () => {
        const ok = form.submit();
        submitHint.setText(ok ? 'Submitted ✓' : '');
      });

      // 反馈类组件演示：Tooltip（悬停）/ Popover（点击）/ Popconfirm（危险确认）
      const tipTarget = new W.UIButton({ id: 'tip-btn', left: 820, top: 656, width: 110, height: 32, text: 'Hover me' });
      W.attachTooltip(ice, tipTarget, { title: '这是工具提示', placement: 'top' });

      const popoverTarget = new W.UIButton({
        id: 'pop-btn',
        left: 946,
        top: 656,
        width: 148,
        height: 32,
        text: 'Show popover',
        variant: 'default',
      });
      W.attachPopover(ice, popoverTarget, { title: '浮层标题', content: '点击外部关闭' });

      const deleteTarget = new W.UIButton({ id: 'del-btn', left: 820, top: 700, width: 140, height: 32, text: 'Delete', danger: true });
      const deleteHint = new W.UILabel({
        left: 974,
        top: 708,
        text: '',
        style: { fontSize: 12, fillStyle: theme.colors.success },
      });
      const messageTarget = new W.UIButton({ id: 'msg-btn', left: 820, top: 744, width: 148, height: 32, text: 'Show message' });
      messageTarget.on('click', () => {
        W.UIMessage.success(ice, '已保存');
        W.UIMessage.info(ice, '正在同步数据');
      });
      const notifyTarget = new W.UIButton({
        id: 'notify-btn',
        left: 974,
        top: 744,
        width: 140,
        height: 32,
        text: 'Notify',
        variant: 'default',
      });
      notifyTarget.on('click', () => {
        W.UINotification.open(ice, { title: '部署完成', description: 'v1.4.0 已上线' });
      });

      const modalTarget = new W.UIButton({ id: 'modal-btn', left: 1106, top: 656, width: 130, height: 32, text: 'Open modal' });
      const modalHint = new W.UILabel({
        left: 1106,
        top: 708,
        text: '',
        style: { fontSize: 12, fillStyle: theme.colors.success },
      });
      const modal = new W.UIModal(ice, {
        title: '确认发布？',
        content: '发布后所有用户立即可见。',
        width: 380,
        onConfirm: () => modalHint.setText('已发布 ✓'),
      });
      modalTarget.on('click', () => modal.open());

      W.attachPopconfirm(ice, deleteTarget, {
        title: '确认删除？',
        description: '删除后不可恢复',
        danger: true,
        onConfirm: () => deleteHint.setText('已删除 ✓'),
      });

      const pageHint = new W.UILabel({
        left: 820,
        top: 776,
        text: '第 1 页 / 每页 10 条',
        style: { fontSize: 12, fillStyle: theme.colors.textSecondary },
      });
      const pagination = new W.UIPagination({
        id: 'pagination',
        left: 820,
        top: 800,
        width: 420,
        total: 238,
        pageSize: 10,
        showTotal: true,
        showSizeChanger: true,
        onChange: (page, pageSize) => pageHint.setText(`第 ${page} 页 / 每页 ${pageSize} 条`),
      });

      // 选择器演示：单选 + 搜索（放在 Feedback 区下方）
      const cityHint = new W.UILabel({
        left: 1106,
        top: 776,
        text: '未选择城市',
        style: { fontSize: 12, fillStyle: theme.colors.textSecondary },
      });
      const citySelect = new W.UISelect({
        id: 'city-select',
        left: 1106,
        top: 800,
        width: 180,
        height: 32,
        placeholder: '请选择城市',
        showSearch: true,
        options: [
          { value: 'hangzhou', label: '杭州' },
          { value: 'shanghai', label: '上海' },
          { value: 'shenzhen', label: '深圳', disabled: true },
          { value: 'beijing', label: '北京' },
        ],
        onChange: (value, option) => cityHint.setText('已选择：' + option.label),
      });

      const drawerTarget = new W.UIButton({ id: 'drawer-btn', left: 1120, top: 744, width: 130, height: 32, text: 'Open drawer' });
      const drawer = new W.UIDrawer(ice, {
        title: '抽屉',
        content: '从右侧滑入，点遮罩或 ✕ 关闭。',
        width: 300,
      });
      drawerTarget.on('click', () => drawer.open());

      // 列表演示：多选 + 内部滚动（内容超出高度时自动套 UIScrollPane）
      const listHint = new W.UILabel({
        left: 820,
        top: 828,
        text: '未选择',
        style: { fontSize: 12, fillStyle: theme.colors.textSecondary },
      });
      const cityList = new W.UIList({
        id: 'city-list',
        left: 820,
        top: 860,
        width: 300,
        height: 120,
        mode: 'multiple',
        itemHeight: 36,
        items: [
          { key: 'a', label: '苹果' },
          { key: 'b', label: '香蕉' },
          { key: 'c', label: '橙子', disabled: true },
          { key: 'd', label: '葡萄' },
          { key: 'e', label: '西瓜' },
          { key: 'f', label: '草莓' },
        ],
        onChange: (keys) => listHint.setText(keys.length ? '已选：' + keys.join('、') : '未选择'),
      });

      // 树演示：两级结构 + 展开/折叠 + 单选
      const treeHint = new W.UILabel({
        left: 1140,
        top: 828,
        text: '未选择节点',
        style: { fontSize: 12, fillStyle: theme.colors.textSecondary },
      });
      const tree = new W.UITree({
        id: 'tree',
        left: 1140,
        top: 856,
        width: 200,
        height: 150,
        defaultExpandAll: true,
        nodes: [
          {
            key: 'root',
            label: '数据源',
            children: [
              { key: 'mysql', label: 'MySQL' },
              { key: 'pg', label: 'PostgreSQL' },
              { key: 'cache', label: '缓存', children: [{ key: 'redis', label: 'Redis' }] },
            ],
          },
          { key: 'logs', label: '日志' },
        ],
        onSelect: (keys, node) => treeHint.setText(node ? '已选择：' + node.label : '未选择节点'),
      });

      // 更多输入与状态：多行文本框 / 密码框 / 分段控制器 / 空状态 / 骨架屏
      const bioArea = new W.UITextArea({ id: 'bio', left: 32, top: 1066, width: 240, placeholder: '多行文本…' });
      const passwordField = new W.UIPasswordField({
        id: 'password',
        left: 300,
        top: 1082,
        width: 200,
        value: 'secret123',
        showToggle: true,
      });
      const rangeSegmented = new W.UISegmented({
        id: 'range',
        left: 524,
        top: 1082,
        width: 240,
        value: 'week',
        options: [
          { value: 'day', label: '日' },
          { value: 'week', label: '周' },
          { value: 'month', label: '月', disabled: true },
        ],
        onChange: (value) => console.log('segmented ->', value),
      });
      const emptyState = new W.UIEmpty({
        id: 'empty',
        left: 788,
        top: 1050,
        width: 200,
        height: 130,
        description: '暂无数据',
        actionText: '新建',
      });
      const skeleton = new W.UISkeleton({
        id: 'skeleton',
        left: 1010,
        top: 1060,
        width: 320,
        rows: 3,
        title: true,
        avatar: true,
        active: true,
      });

      panel.addChildren([
        heading('Buttons', 32, 28),

        new W.UIButton({ id: 'btn-primary', left: 32, top: 64, text: 'Primary', width: 96 }),
        new W.UIButton({ id: 'btn-default', left: 140, top: 64, text: 'Default', width: 96, variant: 'default' }),
        new W.UIButton({ id: 'btn-text', left: 248, top: 64, text: 'Text', width: 72, variant: 'text' }),
        new W.UIButton({ id: 'btn-link', left: 332, top: 64, text: 'Link', width: 72, variant: 'link' }),
        new W.UIButton({ id: 'btn-danger', left: 416, top: 64, text: 'Danger', width: 96, danger: true }),
        new W.UIButton({ id: 'btn-small', left: 524, top: 66, text: 'Small', width: 84, size: 'small' }),
        new W.UIButton({ id: 'btn-large', left: 620, top: 62, text: 'Large', width: 104, size: 'large' }),

        heading('Badges & tags', 32, 128),

        new W.UIBadge({ id: 'badge-primary', left: 32, top: 166, text: '9', width: 32, height: 24 }),
        new W.UIBadge({ id: 'badge-success', left: 76, top: 166, text: 'OK', width: 40, height: 24, status: 'success' }),
        new W.UIBadge({ id: 'badge-warning', left: 128, top: 166, text: 'W', width: 32, height: 24, status: 'warning' }),
        new W.UIBadge({ id: 'badge-error', left: 172, top: 166, text: '5', width: 32, height: 24, status: 'error' }),

        new W.UITag({ id: 'tag-default', left: 224, top: 168, text: 'Default', width: 82, height: 24 }),
        new W.UITag({ id: 'tag-success', left: 318, top: 168, text: 'Success', width: 88, height: 24, status: 'success' }),
        new W.UITag({ id: 'tag-warning', left: 418, top: 168, text: 'Warning', width: 86, height: 24, status: 'warning' }),
        new W.UITag({ id: 'tag-error', left: 516, top: 168, text: 'Error', width: 76, height: 24, status: 'error' }),

        heading('Avatars & icons', 32, 226),

        new W.UIAvatar({ id: 'avatar-a', left: 32, top: 264, text: 'A', size: 36 }),
        new W.UIAvatar({ id: 'avatar-b', left: 82, top: 260, text: 'B', size: 44 }),
        new W.UIAvatar({ id: 'avatar-c', left: 140, top: 254, text: 'C', size: 56, backgroundColor: theme.colors.success }),

        new W.UIIcon({ id: 'icon-star', left: 220, top: 276, icon: '★', size: 24, color: theme.colors.warning }),
        new W.UIIcon({ id: 'icon-check', left: 258, top: 276, icon: '✓', size: 24, color: theme.colors.success }),
        new W.UIIcon({ id: 'icon-info', left: 296, top: 276, icon: 'ℹ', size: 24, color: theme.colors.info }),

        heading('Selection & progress', 32, 340),

        new W.UICheckBox({ id: 'check', left: 32, top: 382, width: 24, height: 24, selected: true }),
        new W.UIRadioButton({ id: 'radio', left: 72, top: 382, width: 24, height: 24, selected: true }),
        new W.UISwitch({ id: 'switch', left: 116, top: 380, width: 52, height: 26, selected: true }),
        new W.UIProgressBar({ id: 'progress', left: 192, top: 388, value: 55, width: 220, height: 10 }),
        new W.UISlider({ id: 'slider', left: 440, top: 384, value: 40, width: 220, height: 18 }),

        heading('Containers', 32, 446),

        new W.UICard({ id: 'card', left: 32, top: 488, title: 'Project summary', width: 300, height: 160 }),
        new W.UITabs({ id: 'tabs', left: 360, top: 488, tabs: ['Overview', 'Activity', 'Settings'], width: 380, height: 40 }),

        new W.UISeparator({ id: 'separator-v', left: 780, top: 488, width: 1, height: 160 }),
        new W.UISeparator({ id: 'separator-h', left: 32, top: 700, width: 500, height: 1 }),

        heading('Form', 420, 620),
        form,
        submitButton,
        submitHint,

        heading('Feedback', 820, 620),
        tipTarget,
        popoverTarget,
        deleteTarget,
        deleteHint,
        modalTarget,
        modalHint,
        messageTarget,
        notifyTarget,
        drawerTarget,
        pagination,
        pageHint,
        citySelect,
        cityHint,
        cityList,
        listHint,
        tree,
        treeHint,
        heading('More inputs & states', 32, 1030),
        bioArea,
        passwordField,
        rangeSegmented,
        emptyState,
        skeleton,

        heading('Scroll pane', 32, 706),
        scrollPane,

        new W.UILabel({
          left: 812,
          top: 540,
          text: 'Canvas-native, Swing-style',
          style: { fontSize: 14, fillStyle: theme.colors.textSecondary },
        }),
      ]);

      // 下拉菜单演示：点 Default 弹菜单，选中后触发按钮文字更新
      const defaultButton = panel.childNodes.find((node) => node.state && node.state.id === 'btn-default');
      const dropdown = W.attachDropdown(ice, defaultButton, {
        items: [
          { key: 'day', label: '按天' },
          { key: 'week', label: '按周' },
          { key: 'month', label: '按月' },
          { key: 'year', label: '按年', disabled: true },
        ],
        selectedKey: 'week',
        onSelect: (item) => defaultButton.setText(item.label),
      });


      // 浮层演示：点 Primary 弹出 popover（弹层底座 + 入场缩放/出场淡出）
      const primaryButton = panel.childNodes.find((node) => node.state && node.state.id === 'btn-primary');
      const makePopover = () => {
        const popover = new W.UIPanel({ width: 208, height: 84, radius: 8 });
        popover.addChild(
          new W.UILabel({ left: 12, top: 10, text: 'Popover', style: { fontSize: 13, fontWeight: '600' } }),
        );
        popover.addChild(
          new W.UILabel({
            left: 12,
            top: 32,
            text: 'Anchored + animated',
            style: { fontSize: 12, fillStyle: theme.colors.textSecondary },
          }),
        );
        popover.addChild(
          new W.UILabel({
            left: 12,
            top: 54,
            text: 'Click outside to close',
            style: { fontSize: 12, fillStyle: theme.colors.textTertiary },
          }),
        );
        return popover;
      };
      primaryButton.on('click', () => {
        const overlays = W.getUIOverlayManager(ice);
        if (overlays.isOpen()) {
          overlays.closeAll();
          return;
        }
        overlays.open({
          anchor: primaryButton,
          content: makePopover(),
          placement: 'bottomLeft',
          enterAnimation: 'scale',
          exitAnimation: 'fade',
        });
      });

      ice.addChild(panel);
      window.__result = { ice, panel, form, nameInput, agreeBox, submitButton, scrollPane, tipTarget, popoverTarget, deleteTarget, deleteHint, modalTarget, modalHint, modal, pagination, pageHint, dropdown, citySelect, cityHint, drawerTarget, drawer, cityList, listHint, tree, treeHint, bioArea, passwordField, rangeSegmented, emptyState, skeleton };
    </script>
  </body>
</html>
