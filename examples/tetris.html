<!DOCTYPE html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <title>ICE Arcade · 俄罗斯方块</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: radial-gradient(circle at 50% 24%, #1b2130 0%, #080a0f 72%);
    }
    canvas {
      display: block;
    }
  </style>
  <body>
    <canvas id="canvas" width="1180" height="800"></canvas>

    <script src="../node_modules/ice-render/dist/index.umd.js"></script>
    <script src="../dist/index.umd.js"></script>
    <script>
      /**
       * ICE Arcade · 第 1 弹：俄罗斯方块。
       *
       * 这一页刻意做成「掌机」而不是又一个后台页面：机壳、屏幕、面板上的卡片全部是
       * ICE 组件，游戏规则则是纯逻辑的 `ICETetrisModel`（和 UI 完全解耦，可单测）。
       *
       * 键盘完全交给游戏自己处理：因此这里**不启动 ICEFocusManager** ——
       * 它会用 Enter/Space 激活「有焦点的按钮」，正好和「空格硬降」打架。
       * 鼠标 hover 仍然接管，按钮该有的悬停反馈不会少。
       */
      (() => {
        'use strict';
        const W = ICEWEB;
        const dpr = (typeof window !== 'undefined' && window.devicePixelRatio) || 1;
        const ice = new ICE.ICE().init('canvas', { dpr });
        // 深色主题：HUD 卡片、按钮、开关都直接吃主题色，和机壳的深灰蓝统一
        W.iceUIManager.setTheme('dark');
        const theme = W.iceUIManager.getTheme();
        new W.ICEHoverManager(ice).start();

        /* --------------------------------- 常量与配色 --------------------------------- */

        const COLS = 10;
        const ROWS = 20;
        const CELL = 26;
        const BOARD_W = COLS * CELL; // 260
        const BOARD_H = ROWS * CELL; // 520
        const BEST_KEY = 'ice-arcade-tetris-best';

        /** 七种方块的颜色：走 Bootstrap 的调色板（info / warning / green / red / blue / orange）。 */
        const PIECE_COLORS = {
          I: '#0dcaf0',
          O: '#ffc107',
          T: '#a370f7',
          S: '#198754',
          Z: '#dc3545',
          J: '#0d6efd',
          L: '#fd7e14',
        };

        const hexToRgb = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
        /** t < 0 变暗、t > 0 变亮。 */
        const shade = (hex, t) => {
          const [r, g, b] = hexToRgb(hex);
          const mix = (v) => Math.round(t < 0 ? v * (1 + t) : v + (255 - v) * t);
          return `rgb(${mix(r)}, ${mix(g)}, ${mix(b)})`;
        };
        const alpha = (hex, a) => {
          const [r, g, b] = hexToRgb(hex);
          return `rgba(${r}, ${g}, ${b}, ${a})`;
        };

        /** 格子的三种样式（缓存成字符串，比对后只对变化的格子 setState）。 */
        const EMPTY_STYLE = 'fill:#1a212b|stroke:#29323f';
        const styleOf = (type, ghost) => {
          const color = PIECE_COLORS[type] || '#adb5bd';
          return ghost ? `fill:${alpha(color, 0.16)}|stroke:${alpha(color, 0.45)}` : `fill:${color}|stroke:${shade(color, -0.35)}`;
        };
        const applyStyle = (node, ghost, type) => {
          const color = PIECE_COLORS[type] || '#adb5bd';
          node.setState({
            style: {
              ...node.state.style,
              fillStyle: ghost ? alpha(color, 0.16) : color,
              strokeStyle: ghost ? alpha(color, 0.45) : shade(color, -0.35),
              lineWidth: ghost ? 1 : 1.5,
            },
          });
        };
        const applyEmpty = (node) => {
          node.setState({ style: { ...node.state.style, fillStyle: '#1a212b', strokeStyle: '#29323f', lineWidth: 1 } });
        };

        /* --------------------------------- 机壳与屏幕 --------------------------------- */

        const shell = new W.ICEWidget({
          id: 'arcade-cabinet',
          left: 30,
          top: 30,
          width: 1120,
          height: 740,
          radius: 34,
          fill: true,
          stroke: true,
          interactive: false,
          style: {
            fillStyle: '#232a36',
            strokeStyle: '#39424f',
            lineWidth: 2,
            shadowColor: 'rgba(0, 0, 0, 0.55)',
            shadowBlur: 30,
            shadowOffsetX: 0,
            shadowOffsetY: 16,
          },
        });
        // 机壳顶部的一道高光，让塑料感不那么平
        const shellHighlight = new W.ICEWidget({
          left: 40,
          top: 40,
          width: 1080,
          height: 2,
          radius: 1,
          fill: true,
          stroke: false,
          interactive: false,
          style: { fillStyle: 'rgba(255, 255, 255, 0.16)' },
        });

        const bezel = new W.ICEWidget({
          id: 'arcade-bezel',
          left: 70,
          top: 90,
          width: 340,
          height: 600,
          radius: 20,
          fill: true,
          stroke: true,
          interactive: false,
          style: { fillStyle: '#0d1117', strokeStyle: '#141a24', lineWidth: 2 },
        });
        const boardLayer = new W.ICEWidget({
          id: 'arcade-board',
          left: 110,
          top: 130,
          width: BOARD_W,
          height: BOARD_H,
          fill: false,
          stroke: false,
          interactive: false,
        });

        const cellNodes = [];
        const cellCache = new Array(ROWS * COLS).fill('');
        for (let row = 0; row < ROWS; row += 1) {
          for (let col = 0; col < COLS; col += 1) {
            const node = new W.ICEWidget({
              id: `arcade-cell-${row}-${col}`,
              left: col * CELL + 1,
              top: row * CELL + 1,
              width: CELL - 2,
              height: CELL - 2,
              radius: 5,
              fill: true,
              stroke: true,
              interactive: false,
              style: { fillStyle: '#1a212b', strokeStyle: '#29323f', lineWidth: 1 },
            });
            boardLayer.addChild(node, false);
            cellNodes.push(node);
          }
        }

        /** 消行闪白：整块棋盘上盖一层，透明度由动画驱动。 */
        const flashOverlay = new W.ICEWidget({
          id: 'arcade-flash',
          left: 0,
          top: 0,
          width: BOARD_W,
          height: BOARD_H,
          fill: true,
          stroke: false,
          display: false,
          interactive: false,
          style: { fillStyle: 'rgba(255, 255, 255, 0.5)' },
        });
        boardLayer.addChild(flashOverlay, false);

        const boardMessage = (id, title, hint, color) => {
          const box = new W.ICEWidget({
            id,
            left: 0,
            top: BOARD_H / 2 - 58,
            width: BOARD_W,
            height: 116,
            fill: true,
            stroke: false,
            display: false,
            interactive: false,
            style: { fillStyle: 'rgba(8, 11, 16, 0.82)' },
          });
          const titleLabel = new W.ICELabel({
            interactive: false,
            left: 0,
            top: 30,
            width: BOARD_W,
            height: 34,
            text: title,
            align: 'center',
            verticalAlign: 'middle',
            style: { fontSize: 24, fontWeight: '700', fillStyle: color },
          });
          const hintLabel = new W.ICELabel({
            interactive: false,
            left: 0,
            top: 66,
            width: BOARD_W,
            height: 20,
            text: hint,
            align: 'center',
            verticalAlign: 'middle',
            style: { fontSize: 12, fillStyle: theme.colors.textSecondary },
          });
          box.addChild(titleLabel, false);
          box.addChild(hintLabel, false);
          boardLayer.addChild(box, false);
          return { box, titleLabel, hintLabel };
        };
        const pauseMessage = boardMessage('arcade-paused', '已暂停', '按 P 继续', theme.colors.warning);
        const overMessage = boardMessage('arcade-over', 'GAME OVER', '按 R 再开一局', theme.colors.error);

        /* --------------------------------- 右侧 HUD --------------------------------- */

        const title = new W.ICELabel({
          interactive: false,
          left: 450,
          top: 74,
          width: 660,
          height: 40,
          text: 'ICE ARCADE',
          style: { fontSize: 32, fontWeight: '700', fillStyle: '#f8f9fa' },
        });
        const subtitle = new W.ICELabel({
          id: 'arcade-subtitle',
          interactive: false,
          left: 450,
          top: 116,
          width: 660,
          height: 20,
          text: '第 1 弹 · 俄罗斯方块 · 7-bag 公平随机',
          style: { fontSize: 13, fillStyle: theme.colors.textSecondary },
        });

        /** 卡带槽（游戏合集）：当前只有第一弹能玩，其余挂着「敬请期待」。 */
        const comingSoon = ['贪吃蛇', '中国象棋'];
        const cartridgeButtons = [
          new W.ICEButton({ id: 'arcade-game-tetris', left: 450, top: 150, width: 150, height: 32, text: '俄罗斯方块', variant: 'primary', size: 'small' }),
        ];
        comingSoon.forEach((name, index) => {
          const button = new W.ICEButton({
            id: `arcade-game-soon-${index}`,
            left: 610 + index * 160,
            top: 150,
            width: 150,
            height: 32,
            text: name,
            variant: 'default',
            size: 'small',
          });
          button.setEnabled(false);
          cartridgeButtons.push(button);
        });

        const card = (id, left, top, width, caption) => {
          const panel = new W.ICEPanel({ left, top, width, height: 104, interactive: false });
          const captionLabel = new W.ICELabel({
            interactive: false,
            left: 16,
            top: 14,
            width: width - 32,
            height: 18,
            text: caption,
            style: { fontSize: 12, fillStyle: theme.colors.textSecondary },
          });
          const value = new W.ICELabel({
            id,
            interactive: false,
            left: 16,
            top: 40,
            width: width - 32,
            height: 44,
            text: '0',
            align: 'left',
            verticalAlign: 'middle',
            style: { fontSize: 30, fontWeight: '700', fontFamily: '"Courier New", monospace', fillStyle: '#f8f9fa' },
          });
          panel.addChild(captionLabel, false);
          panel.addChild(value, false);
          return { panel, value };
        };
        const scoreCard = card('arcade-score', 450, 200, 320, '得分 SCORE');
        const linesCard = card('arcade-lines', 786, 200, 150, '消行 LINES');
        const levelCard = card('arcade-level', 952, 200, 150, '等级 LEVEL');

        const progressPanel = new W.ICEPanel({ left: 450, top: 320, width: 660, height: 76, interactive: false });
        const progressCaption = new W.ICELabel({
          interactive: false,
          left: 16,
          top: 14,
          width: 220,
          height: 18,
          text: '升级进度',
          style: { fontSize: 12, fillStyle: theme.colors.textSecondary },
        });
        const progressBar = new W.ICEProgressBar({
          id: 'arcade-progress',
          left: 16,
          top: 42,
          width: 460,
          height: 14,
          max: 10,
          value: 0,
          showText: false,
          interactive: false,
        });
        const progressLabel = new W.ICELabel({
          id: 'arcade-progress-label',
          interactive: false,
          left: 496,
          top: 30,
          width: 148,
          height: 38,
          text: '0 / 10 行',
          align: 'right',
          verticalAlign: 'middle',
          style: { fontSize: 13, fillStyle: theme.colors.textSecondary },
        });
        progressPanel.addChild(progressCaption, false);
        progressPanel.addChild(progressBar, false);
        progressPanel.addChild(progressLabel, false);

        const nextPanel = new W.ICEPanel({ left: 450, top: 412, width: 320, height: 196, interactive: false });
        const nextCaption = new W.ICELabel({
          interactive: false,
          left: 16,
          top: 14,
          width: 288,
          height: 18,
          text: '下一批 NEXT',
          style: { fontSize: 12, fillStyle: theme.colors.textSecondary },
        });
        nextPanel.addChild(nextCaption, false);
        const PREVIEW_CELL = 18;
        const nextSlots = [0, 1, 2].map((index) => {
          const slot = new W.ICEWidget({
            id: `arcade-next-${index}`,
            left: 16 + index * 100,
            top: 46,
            width: 88,
            height: 132,
            radius: 12,
            fill: true,
            stroke: true,
            interactive: false,
            style: { fillStyle: '#12161d', strokeStyle: '#232b36', lineWidth: 1 },
          });
          const cells = Array.from({ length: 4 }, () => {
            const cell = new W.ICEWidget({
              left: 0,
              top: 0,
              width: PREVIEW_CELL - 2,
              height: PREVIEW_CELL - 2,
              radius: 4,
              fill: true,
              stroke: true,
              display: false,
              interactive: false,
              style: { fillStyle: '#0d1117', strokeStyle: '#0d1117', lineWidth: 1 },
            });
            slot.addChild(cell, false);
            return cell;
          });
          nextPanel.addChild(slot, false);
          return { slot, cells };
        });

        const helpPanel = new W.ICEPanel({ left: 790, top: 412, width: 320, height: 196, interactive: false });
        const helpCaption = new W.ICELabel({
          interactive: false,
          left: 16,
          top: 14,
          width: 288,
          height: 18,
          text: '操作 CONTROLS',
          style: { fontSize: 12, fillStyle: theme.colors.textSecondary },
        });
        helpPanel.addChild(helpCaption, false);
        // 两列排版：左手按键（等宽字体，固定 110 宽）、右手说明 —— 不用空格硬凑对齐
        [
          ['← / →', '左右移动'],
          ['↓', '软降（+1/格）'],
          ['空格', '硬降（+2/格）'],
          ['↑ 或 X', '顺时针旋转'],
          ['Z', '逆时针旋转'],
          ['P / R', '暂停 / 重开'],
        ].forEach(([keys, desc], index) => {
          const keyLabel = new W.ICELabel({
            interactive: false,
            left: 16,
            top: 42 + index * 24,
            width: 110,
            height: 20,
            text: keys,
            style: { fontSize: 13, fontFamily: '"Courier New", monospace', fillStyle: theme.colors.text },
          });
          const descLabel = new W.ICELabel({
            interactive: false,
            left: 130,
            top: 42 + index * 24,
            width: 174,
            height: 20,
            text: desc,
            style: { fontSize: 13, fillStyle: theme.colors.textSecondary },
          });
          helpPanel.addChild(keyLabel, false);
          helpPanel.addChild(descLabel, false);
        });

        const pauseButton = new W.ICEButton({ id: 'arcade-pause', left: 450, top: 630, width: 150, height: 40, text: '暂停 (P)' });
        const restartButton = new W.ICEButton({
          id: 'arcade-restart',
          left: 614,
          top: 630,
          width: 150,
          height: 40,
          text: '重新开始 (R)',
          variant: 'default',
        });
        const soundSwitch = new W.ICESwitch({ id: 'arcade-sound', left: 800, top: 640, width: 46, height: 22, selected: true });
        const soundLabel = new W.ICELabel({
          interactive: false,
          left: 856,
          top: 640,
          width: 80,
          height: 22,
          text: '音效',
          verticalAlign: 'middle',
          style: { fontSize: 13, fillStyle: theme.colors.text },
        });
        const bestLabel = new W.ICELabel({
          id: 'arcade-best',
          interactive: false,
          left: 950,
          top: 640,
          width: 160,
          height: 22,
          text: '最高分 0',
          align: 'right',
          verticalAlign: 'middle',
          style: { fontSize: 13, fillStyle: theme.colors.textSecondary },
        });
        const footer = new W.ICELabel({
          interactive: false,
          left: 450,
          top: 700,
          width: 660,
          height: 20,
          text: '纯逻辑模型 ICETetrisModel + ICE 组件绘制 · 规则与渲染完全解耦',
          style: { fontSize: 12, fillStyle: theme.colors.textTertiary },
        });

        ice.addChild(shell);
        ice.addChild(shellHighlight);
        ice.addChild(bezel);
        ice.addChild(boardLayer);
        [
          title,
          subtitle,
          ...cartridgeButtons,
          scoreCard.panel,
          linesCard.panel,
          levelCard.panel,
          progressPanel,
          nextPanel,
          helpPanel,
          pauseButton,
          restartButton,
          soundSwitch,
          soundLabel,
          bestLabel,
          footer,
        ].forEach((node) => ice.addChild(node));

        /* --------------------------------- 音效（WebAudio，无外部资源） --------------------------------- */

        const sound = { enabled: true, ctx: null };
        const beep = (freq, ms, type = 'square', gain = 0.04) => {
          if (!sound.enabled) return;
          try {
            const Ctor = window.AudioContext || window.webkitAudioContext;
            if (!Ctor) return;
            if (!sound.ctx) sound.ctx = new Ctor();
            const ctx = sound.ctx;
            const osc = ctx.createOscillator();
            const amp = ctx.createGain();
            osc.type = type;
            osc.frequency.value = freq;
            amp.gain.value = gain;
            osc.connect(amp);
            amp.connect(ctx.destination);
            osc.start();
            osc.stop(ctx.currentTime + ms / 1000);
          } catch (err) {
            /* 没有音频设备（headless）时静默降级 */
          }
        };
        // change 事件只当作「状态变了」的信号，值直接从开关上读，避免依赖事件载荷细节
        soundSwitch.on('change', () => {
          sound.enabled = soundSwitch.isSelected();
        });

        /* --------------------------------- 模型与状态 --------------------------------- */

        let best = 0;
        try {
          best = Number(localStorage.getItem(BEST_KEY) || 0) || 0;
        } catch (err) {
          /* file:// 下不可用时忽略 */
        }

        const model = new W.ICETetrisModel({ rows: ROWS, cols: COLS });
        const state = { flash: 0, combo: 0, level: model.getLevel(), lines: 0, over: false };

        const syncBest = () => {
          bestLabel.setText(`最高分 ${best}`);
        };
        const saveBest = () => {
          try {
            localStorage.setItem(BEST_KEY, String(best));
          } catch (err) {
            /* 忽略 */
          }
        };

        /* --------------------------------- 绘制 --------------------------------- */

        let previewKey = '';
        const preview = () => {
          const queue = model.getNextQueue().slice(0, nextSlots.length);
          const key = queue.join(',');
          if (key === previewKey) return;
          previewKey = key;
          nextSlots.forEach((entry, index) => {
            const type = queue[index];
            const offsets = (W.ICE_TETROMINOES[type] || [])[0] || [];
            entry.cells.forEach((cell) => cell.setState({ display: false }));
            if (!offsets.length) return;
            const rows = offsets.map(([row]) => row);
            const cols = offsets.map(([, col]) => col);
            const minRow = Math.min(...rows);
            const minCol = Math.min(...cols);
            const width = Math.max(...cols) - minCol + 1;
            const height = Math.max(...rows) - minRow + 1;
            const originX = Math.round((entry.slot.state.width - (width * PREVIEW_CELL - 2)) / 2);
            const originY = Math.round((entry.slot.state.height - (height * PREVIEW_CELL - 2)) / 2);
            offsets.forEach(([row, col], cellIndex) => {
              const cell = entry.cells[cellIndex];
              cell.setState({ display: true, left: originX + (col - minCol) * PREVIEW_CELL, top: originY + (row - minRow) * PREVIEW_CELL });
              applyStyle(cell, false, type);
            });
          });
        };

        const paintBoard = () => {
          const board = model.getBoard();
          const filled = new Array(ROWS * COLS).fill(null);
          for (let row = 0; row < ROWS; row += 1) {
            for (let col = 0; col < COLS; col += 1) {
              const cell = board[row][col];
              if (cell) filled[row * COLS + col] = { type: cell, ghost: false };
            }
          }
          if (!model.isGameOver()) {
            model.getGhost().forEach(([row, col]) => {
              const index = row * COLS + col;
              if (index >= 0 && index < filled.length && !filled[index]) filled[index] = { type: model.getCurrent().type, ghost: true };
            });
            model.getCurrent().cells.forEach(([row, col]) => {
              if (row < 0) return;
              filled[row * COLS + col] = { type: model.getCurrent().type, ghost: false };
            });
          }
          for (let index = 0; index < cellNodes.length; index += 1) {
            const entry = filled[index];
            const key = entry ? styleOf(entry.type, entry.ghost) : EMPTY_STYLE;
            if (cellCache[index] === key) continue;
            cellCache[index] = key;
            if (entry) applyStyle(cellNodes[index], entry.ghost, entry.type);
            else applyEmpty(cellNodes[index]);
          }
        };

        let pauseText = '';
        const sync = () => {
          paintBoard();
          scoreCard.value.setText(String(model.getScore()));
          linesCard.value.setText(String(model.getLines()));
          levelCard.value.setText(String(model.getLevel()));
          const inLevel = model.getLines() % 10;
          progressBar.setValue(inLevel);
          progressLabel.setText(`${inLevel} / 10 行`);
          preview();
          const nextPauseText = model.isPaused() ? '继续 (P)' : '暂停 (P)';
          if (nextPauseText !== pauseText) {
            pauseText = nextPauseText;
            pauseButton.setText(nextPauseText);
          }
          pauseMessage.box.setState({ display: model.isPaused() && !model.isGameOver() });
          overMessage.box.setState({ display: model.isGameOver() });
          ice.dirty = true;
        };

        const updateFlash = () => {
          if (state.flash <= 0) {
            if (flashOverlay.state.display !== false) flashOverlay.setState({ display: false });
            return;
          }
          flashOverlay.setState({
            display: true,
            style: { ...flashOverlay.state.style, fillStyle: `rgba(255, 255, 255, ${(0.45 * state.flash).toFixed(3)})` },
          });
          ice.dirty = true;
        };

        /* --------------------------------- 特效与提示 --------------------------------- */

        const toast = (text, type = 'success') => W.ICEMessage.show(ice, text, { type });

        model.addChangeListener(() => {
          const lines = model.getLines();
          const cleared = model.getLastClearedLines();
          if (lines > state.lines && cleared > 0) {
            state.flash = 1;
            state.combo += 1;
            beep(cleared >= 4 ? 880 : 660, 120, 'triangle');
            if (cleared >= 4) toast('TETRIS！四行消除');
            else if (cleared >= 2) toast(`${cleared} 行消除`);
          } else if (cleared === 0) {
            state.combo = 0;
          }
          state.lines = lines;
          if (model.getLevel() > state.level) {
            state.level = model.getLevel();
            toast(`升到 LV.${state.level}，下落加速`, 'warning');
            beep(520, 90, 'square');
          }
          if (model.isGameOver() && !state.over) {
            state.over = true;
            state.flash = 0;
            if (model.getScore() > best) {
              best = model.getScore();
              saveBest();
              syncBest();
            }
            toast(`游戏结束 · 得分 ${model.getScore()}`, 'error');
            beep(150, 420, 'sawtooth', 0.05);
          }
        });

        /* --------------------------------- 循环 --------------------------------- */

        let last = 0;
        let accumulator = 0;
        /** 换方块（含重开）时把重力计时归零：新方块不该「一出生就掉一格」。 */
        let gravityPiece = null;
        const frame = (now) => {
          const dt = last ? Math.min(100, now - last) : 0;
          last = now;
          const piece = model.getCurrent();
          if (piece !== gravityPiece) {
            gravityPiece = piece;
            accumulator = 0;
          }
          if (!model.isPaused() && !model.isGameOver()) {
            accumulator += dt;
            const interval = model.getDropInterval();
            while (accumulator >= interval) {
              accumulator -= interval;
              model.tick();
            }
          } else {
            accumulator = 0;
          }
          if (state.flash > 0) {
            state.flash = Math.max(0, state.flash - dt / 220);
            updateFlash();
          }
          requestAnimationFrame(frame);
        };
        requestAnimationFrame(frame);

        /* --------------------------------- 交互 --------------------------------- */

        const restart = () => {
          model.reset();
          state.flash = 0;
          state.combo = 0;
          state.level = model.getLevel();
          state.lines = 0;
          state.over = false;
          updateFlash();
          sync();
        };
        const togglePause = () => {
          if (model.isGameOver()) return;
          if (model.isPaused()) model.resume();
          else model.pause();
        };

        pauseButton.on('click', togglePause);
        restartButton.on('click', restart);

        window.addEventListener('keydown', (event) => {
          const key = event.key;
          const known = ['ArrowLeft', 'ArrowRight', 'ArrowDown', 'ArrowUp', ' ', 'Spacebar', 'z', 'Z', 'x', 'X', 'p', 'P', 'r', 'R'];
          if (known.indexOf(key) === -1) return;
          event.preventDefault();
          const repeating = event.repeat === true;
          switch (key) {
            case 'ArrowLeft':
              model.moveLeft();
              break;
            case 'ArrowRight':
              model.moveRight();
              break;
            case 'ArrowDown':
              model.softDrop();
              break;
            case 'ArrowUp':
            case 'x':
            case 'X':
              if (!repeating && model.rotateCW()) beep(380, 40, 'square', 0.02);
              break;
            case 'z':
            case 'Z':
              if (!repeating && model.rotateCCW()) beep(320, 40, 'square', 0.02);
              break;
            case ' ':
            case 'Spacebar':
              if (!repeating) {
                model.hardDrop();
                beep(180, 70, 'square', 0.03);
              }
              break;
            case 'p':
            case 'P':
              if (!repeating) togglePause();
              break;
            case 'r':
            case 'R':
              if (!repeating) restart();
              break;
            default:
              break;
          }
        });

        // 切走标签页自动暂停，回来接着玩（游戏机也这么干）
        window.addEventListener('blur', () => {
          if (!model.isGameOver() && !model.isPaused()) model.pause();
        });

        model.addChangeListener(sync);
        syncBest();
        sync();

        /** 浏览器 QA 用的句柄（和 XP 示例的 window.__result 同一套路）。 */
        window.__arcade = {
          ice,
          model,
          restart,
          togglePause,
          sound,
          buttons: { pauseButton, restartButton, soundSwitch },
          scoreCard: scoreCard.value,
          bestLabel,
          nodes: { shell, bezel, boardLayer, nextPanel, helpPanel, progressBar },
        };
      })();
    </script>
  </body>
</html>
