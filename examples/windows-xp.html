<!DOCTYPE html>
<html lang="zh-CN">
  <meta charset="utf-8" />
  <title>ICE Desktop · Windows XP</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
    }
  </style>
  <body>
    <canvas id="canvas" width="1440" height="900"></canvas>

    <script src="../node_modules/ice-render/dist/index.umd.js"></script>
    <script src="../dist/index.umd.js"></script>
    <script>
      const ice = new ICE.ICE().init('canvas');
      const W = ICEWEB;
      const theme = W.iceUIManager.getTheme();
      new W.ICEHoverManager(ice).start();
      W.getICEFocusManager(ice).start();

      const SCREEN_W = 1440;
      const SCREEN_H = 900;
      const TASKBAR_H = 36;
      const DESKTOP_H = SCREEN_H - TASKBAR_H;

      const toast = (text, type = 'success') => W.ICEMessage.show(ice, text, { type });
      const desktopBox = { left: 0, top: 0, width: SCREEN_W, height: DESKTOP_H };
      const XPFONT = 'Tahoma, "Microsoft YaHei", sans-serif';
      /** 给浏览器 QA / 调试用的句柄（各应用自己往里塞） */
      const handles = {};

      /** 把子树抬到指定 zIndex（同值保持父子顺序）。 */
      const raise = (node, z) => {
        if (!node || !node.state) return;
        node.state.zIndex = z;
        (node.childNodes || []).forEach((child) => raise(child, z));
      };
      const mixHex = (from, to, t) => {
        const parse = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
        const [r1, g1, b1] = parse(from);
        const [r2, g2, b2] = parse(to);
        const ch = (a, b) => Math.round(a + (b - a) * t).toString(16).padStart(2, '0');
        return `#${ch(r1, r2)}${ch(g1, g2)}${ch(b1, b2)}`;
      };
      /** 用横向色带拼出渐变（引擎的 fillStyle 只吃纯色）。 */
      const gradient = (parent, left, top, width, height, from, to, bands = 12, radius = 0) => {
        const nodes = [];
        for (let i = 0; i < bands; i += 1) {
          const band = new W.ICEWidget({
            left,
            top: top + (i * height) / bands,
            width,
            height: height / bands + 1,
            radius,
            fill: true,
            stroke: false,
            // 纯装饰色带：不参与命中，否则会把容器的点击吃掉
            interactive: false,
            style: { fillStyle: mixHex(from, to, i / (bands - 1)) },
          });
          parent.addChild(band, false);
          nodes.push(band);
        }
        return nodes;
      };

      /* ============================ 桌面壁纸 ============================ */
      const WALLPAPERS = {
        bliss: { name: '蓝天绿地（经典）', sky: ['#1b4fa8', '#8fc9ff'], hill: ['#3f8c22', '#8ec63f'], cloud: '#ffffff' },
        sunset: { name: '落日余晖', sky: ['#f2953f', '#ffe0a3'], hill: ['#5a3b1e', '#a5723a'], cloud: '#fff2d6' },
        ocean: { name: '深海夜蓝', sky: ['#071c3d', '#2b6fb5'], hill: ['#04121f', '#0d3b5c'], cloud: '#cfe6ff' },
      };

      // 桌面根容器与各层都是「纯布局」：interactive:false，避免挡住内部的图标/窗口/任务栏按钮
      const desktop = new W.ICEWidget({
        left: 0,
        top: 0,
        width: SCREEN_W,
        height: DESKTOP_H,
        fill: false,
        stroke: false,
        interactive: false,
      });
      const wallpaper = new W.ICEWidget({ left: 0, top: 0, width: SCREEN_W, height: DESKTOP_H, fill: false, stroke: false });
      desktop.addChild(wallpaper, false);

      const paintWallpaper = (presetKey) => {
        const preset = WALLPAPERS[presetKey] || WALLPAPERS.bliss;
        wallpaper.removeChildren([...wallpaper.childNodes]);
        gradient(wallpaper, 0, 0, SCREEN_W, DESKTOP_H, preset.sky[0], preset.sky[1], 24);
        // 云：三团叠起来的小椭圆（一朵云一个组，避免大椭圆互相咬出奇怪形状）
        const cloud = (baseLeft, baseTop, scale) => {
          [
            [0, 10, 36, 20],
            [30, 0, 30, 22],
            [58, 12, 26, 16],
          ].forEach(([dx, dy, rx, ry]) => {
            wallpaper.addChild(
              new ICE.ICEEllipse({
                left: baseLeft + dx * scale,
                top: baseTop + dy * scale,
                radiusX: rx * scale,
                radiusY: ry * scale,
                fill: true,
                stroke: false,
                opacity: 0.8,
                style: { fillStyle: preset.cloud },
              }),
              false,
            );
          });
        };
        cloud(150, 70, 1);
        cloud(1080, 54, 0.85);
        // 山丘：大椭圆露出来的上半部分
        wallpaper.addChild(
          new ICE.ICEEllipse({
            left: -260,
            top: 470,
            radiusX: 1000,
            radiusY: 330,
            fill: true,
            stroke: false,
            style: { fillStyle: preset.hill[1] },
          }),
          false,
        );
        wallpaper.addChild(
          new ICE.ICEEllipse({
            left: 640,
            top: 560,
            radiusX: 720,
            radiusY: 260,
            fill: true,
            stroke: false,
            style: { fillStyle: preset.hill[0] },
          }),
          false,
        );
        ice.dirty = true;
      };
      paintWallpaper('bliss');

      /* ============================ 任务栏 ============================ */
      const taskbar = new W.ICEWidget({
        id: 'taskbar',
        left: 0,
        top: DESKTOP_H,
        width: SCREEN_W,
        height: TASKBAR_H,
        fill: false,
        stroke: false,
        interactive: false,
      });
      gradient(taskbar, 0, 0, SCREEN_W, TASKBAR_H, '#245edb', '#3f8cf3', 8);
      const taskbarTop = new W.ICEWidget({
        left: 0,
        top: 0,
        width: SCREEN_W,
        height: 2,
        fill: true,
        stroke: false,
        style: { fillStyle: '#7aa9f7' },
      });
      taskbar.addChild(taskbarTop, false);

      const startButton = new W.ICEWidget({
        id: 'start-button',
        left: 0,
        top: 0,
        width: 108,
        height: TASKBAR_H,
        fill: false,
        stroke: false,
      });
      gradient(startButton, 2, 2, 92, TASKBAR_H - 4, '#3c8c1e', '#7ad04a', 8, 10);
      startButton.addChild(
        new W.ICELabel({
          interactive: false,
          left: 8,
          top: 0,
          width: 84,
          height: TASKBAR_H,
          text: '⊞  开始',
          verticalAlign: 'middle',
          style: { fontSize: 14, fontWeight: '700', fontStyle: 'italic', fillStyle: '#ffffff', fontFamily: XPFONT },
        }),
        false,
      );
      taskbar.addChild(startButton, false);

      const clockLabel = new W.ICELabel({
        id: 'tray-clock',
        interactive: false,
        left: SCREEN_W - 86,
        top: 0,
        width: 78,
        height: TASKBAR_H,
        text: '00:00',
        align: 'center',
        verticalAlign: 'middle',
        style: { fontSize: 12, fillStyle: '#ffffff', fontFamily: XPFONT },
      });
      const tray = new W.ICEWidget({
        left: SCREEN_W - 190,
        top: 2,
        width: 186,
        height: TASKBAR_H - 4,
        radius: 4,
        fill: true,
        stroke: false,
        interactive: false,
        style: { fillStyle: 'rgba(255,255,255,0.14)' },
      });
      tray.addChild(
        new W.ICELabel({
          interactive: false,
          left: 8,
          top: 0,
          width: 96,
          height: TASKBAR_H - 4,
          text: '🔊  🛡  📶',
          verticalAlign: 'middle',
          style: { fontSize: 12, fillStyle: '#ffffff' },
        }),
        false,
      );
      taskbar.addChild(tray, false);
      taskbar.addChild(clockLabel, false);

      // 任务栏按钮区（打开窗口后往里加按钮）
      const taskButtons = new W.ICEWidget({
        left: 116,
        top: 4,
        width: 1000,
        height: TASKBAR_H - 8,
        fill: false,
        stroke: false,
        interactive: false,
      });
      taskbar.addChild(taskButtons, false);

      /* ============================ 窗口系统 ============================ */
      const iconLayer = new W.ICEWidget({ left: 0, top: 0, width: SCREEN_W, height: DESKTOP_H, fill: false, stroke: false, interactive: false });
      desktop.addChild(iconLayer, false);
      const windowLayer = new W.ICEWidget({ left: 0, top: 0, width: SCREEN_W, height: DESKTOP_H, fill: false, stroke: false });
      desktop.addChild(windowLayer, false);

      let topZ = 100;
      const openWindows = new Map();
      let activeKey = null;

      const refreshTaskButtons = () => {
        taskButtons.removeChildren([...taskButtons.childNodes]);
        let left = 0;
        openWindows.forEach((entry, key) => {
          const active = activeKey === key && !entry.minimized;
          const button = new W.ICEWidget({
            id: 'task-' + key,
            left,
            top: 0,
            width: 168,
            height: TASKBAR_H - 8,
            radius: 3,
            fill: true,
            stroke: true,
            style: {
              fillStyle: active ? '#1c4fbd' : 'rgba(255,255,255,0.22)',
              strokeStyle: active ? '#0a246a' : 'rgba(255,255,255,0.35)',
              lineWidth: 1,
            },
          });
          button.addChild(
            new W.ICELabel({
              interactive: false,
              left: 8,
              top: 0,
              width: 152,
              height: TASKBAR_H - 8,
              text: `${entry.icon}  ${entry.title}`,
              verticalAlign: 'middle',
              style: { fontSize: 12, fillStyle: '#ffffff', fontFamily: XPFONT },
            }),
            false,
          );
          button.on('click', () => {
            if (entry.minimized) {
              showWindow(key);
            } else if (activeKey === key) {
              minimizeWindow(key);
            } else {
              focusWindow(key);
            }
          });
          taskButtons.addChild(button, false);
          left += 172;
        });
        ice.dirty = true;
      };

      const focusWindow = (key) => {
        const entry = openWindows.get(key);
        if (!entry) return;
        entry.minimized = false;
        entry.window.setState({ display: true });
        activeKey = key;
        topZ += 1;
        raise(entry.window, topZ);
        openWindows.forEach((other, otherKey) => other.window.setActive(otherKey === key));
        refreshTaskButtons();
      };

      const minimizeWindow = (key) => {
        const entry = openWindows.get(key);
        if (!entry) return;
        entry.minimized = true;
        entry.window.setState({ display: false });
        if (activeKey === key) activeKey = null;
        refreshTaskButtons();
      };

      const showWindow = (key) => focusWindow(key);

      const closeWindow = (key) => {
        const entry = openWindows.get(key);
        if (!entry) return;
        windowLayer.removeChild(entry.window);
        openWindows.delete(key);
        if (activeKey === key) activeKey = null;
        refreshTaskButtons();
        toast(`已关闭：${entry.title}`, 'info');
      };

      const openApp = (app) => {
        const existing = openWindows.get(app.key);
        if (existing) {
          focusWindow(app.key);
          return;
        }
        const offset = openWindows.size * 26;
        const win = new W.ICEWindow({
          id: 'window-' + app.key,
          title: app.title,
          icon: app.icon,
          left: Math.min(360, 120 + offset),
          top: 60 + offset,
          width: app.width,
          height: app.height,
          bounds: desktopBox,
          minWidth: 320,
          minHeight: 220,
          content: app.build(),
          onClose: () => closeWindow(app.key),
          onMinimize: () => minimizeWindow(app.key),
          onActivate: () => {
            activeKey = app.key;
            topZ += 1;
            raise(win, topZ);
            openWindows.forEach((other, otherKey) => other.window.setActive(otherKey === app.key));
            refreshTaskButtons();
          },
        });
        windowLayer.addChild(win, false);
        openWindows.set(app.key, { window: win, title: app.title, icon: app.icon, minimized: false });
        focusWindow(app.key);
      };

      /* ============================ 应用：我的电脑 ============================ */
      const buildMyComputer = () => {
        const pane = new W.ICEWidget({ width: 100, height: 100, fill: false, stroke: false, interactive: false });
        const leftPanel = new W.ICEPanel({ left: 0, top: 0, width: 220, height: 100, style: { fillStyle: '#d6e5fb' } });
        leftPanel.addChild(
          new W.ICELabel({
            left: 12,
            top: 12,
            width: 196,
            text: '系统任务',
            style: { fontSize: 12, fontWeight: '700', fillStyle: '#0a246a' },
          }),
          false,
        );
        const tree = new W.ICETree({
          left: 12,
          top: 38,
          width: 196,
          height: 220,
          defaultExpandAll: true,
          nodes: [
            {
              key: 'desktop',
              label: '桌面',
              children: [
                { key: 'local', label: '本地磁盘 (C:)' },
                { key: 'data', label: '数据盘 (D:)' },
                { key: 'cdrom', label: 'DVD 驱动器 (E:)' },
              ],
            },
          ],
          onSelect: (node) => node && toast('选中：' + node.label, 'info'),
        });
        leftPanel.addChild(tree, false);
        const rightPanel = new W.ICEPanel({ left: 0, top: 0, width: 100, height: 100, style: { fillStyle: '#ffffff' } });
        const drives = new W.ICETable({
          left: 0,
          top: 0,
          width: 100,
          rowHeight: 34,
          columns: [
            { key: 'name', title: '名称' },
            { key: 'type', title: '类型' },
            { key: 'total', title: '总大小', align: 'right' },
            { key: 'free', title: '可用空间', align: 'right' },
          ],
          data: [
            { name: '本地磁盘 (C:)', type: '系统盘', total: '120 GB', free: '38.4 GB' },
            { name: '数据盘 (D:)', type: '本地磁盘', total: '512 GB', free: '221 GB' },
            { name: 'DVD 驱动器 (E:)', type: '光驱', total: '—', free: '—' },
            { name: 'U 盘 (F:)', type: '可移动磁盘', total: '32 GB', free: '12.6 GB' },
          ],
          onSelect: (row) => row && toast('打开：' + row.name, 'info'),
        });
        const info = new W.ICEDescriptions({
          left: 0,
          top: 0,
          width: 100,
          column: 2,
          items: [
            { label: '处理器', value: 'Intel Pentium 4 2.4GHz' },
            { label: '内存', value: '512 MB' },
            { label: '操作系统', value: 'Microsoft Windows XP' },
            { label: 'Service Pack', value: 'Service Pack 3' },
          ],
        });
        const splitter = new W.ICESplitter({
          left: 0,
          top: 0,
          width: 100,
          height: 100,
          size: 228,
          min: 160,
          first: leftPanel,
          second: rightPanel,
        });
        rightPanel.addChildren([drives, info], { align: 'top' });
        rightPanel.addChild(
          new W.ICELabel({
            left: 12,
            top: 300,
            width: 320,
            text: '驱动器列表可以直接点行选中（表格），右侧显示系统信息（描述列表）。',
            style: { fontSize: 11, fillStyle: '#6c757d' },
          }),
          false,
        );
        drives.setState({ left: 12, top: 12 });
        info.setState({ left: 12, top: 196 });
        const layout = () => {
          const width = Number(pane.state.width) || 600;
          const height = Number(pane.state.height) || 400;
          splitter.setState({ width, height });
          rightPanel.setState({});
          const second = Math.max(200, width - 228 - 6);
          drives.setState({ width: second - 24 });
          info.setState({ width: second - 24 });
        };
        pane.addChild(splitter, false);
        pane.revalidate = function () {
          W.ICEWidget.prototype.revalidate.call(this);
          layout();
          return this;
        };
        setTimeout(layout, 0);
        handles.computer = { splitter, drives, tree };
        return pane;
      };

      /* ============================ 应用：记事本 ============================ */
      const buildNotepad = () => {
        const pane = new W.ICEWidget({
          width: 100,
          height: 100,
          fill: true,
          stroke: false,
          interactive: false,
          style: { fillStyle: '#ffffff' },
        });
        const menus = ['文件', '编辑', '格式', '查看', '帮助'];
        let left = 6;
        menus.forEach((label) => {
          const button = new W.ICEButton({ left, top: 4, width: 52, height: 22, text: label, size: 'small', variant: 'text' });
          pane.addChild(button, false);
          left += 54;
          if (label === '文件') {
            W.attachDropdown(ice, button, {
              items: [
                { key: 'new', label: '新建' },
                { key: 'save', label: '保存' },
                { key: 'exit', label: '退出' },
              ],
              onSelect: (item) => {
                if (item.key === 'exit') {
                  closeWindow('notepad');
                  return;
                }
                toast(item.key === 'new' ? '已新建文档' : '已保存到 C:\\我的文档\\未命名.txt', 'info');
              },
            });
          }
        });
        const editor = new W.ICETextArea({
          id: 'notepad-editor',
          left: 6,
          top: 30,
          width: 100,
          height: 100,
          value:
            '欢迎使用 ICE 记事本\r\n' +
            '\r\n' +
            '这个窗口里的所有像素都是 canvas 画的：\r\n' +
            '  · 标题栏、按钮、菜单、状态栏 —— 用组件库拼出来\r\n' +
            '  · 拖动标题栏可以移动窗口，双击任务栏按钮可以最小化\r\n' +
            '  · 右下角拖动可以改窗口大小\r\n',
        });
        const status = new W.ICELabel({
          left: 6,
          top: 100,
          width: 100,
          height: 20,
          text: '第 1 行，第 1 列    |    UTF-8    |    12 KB',
          style: { fontSize: 11, fillStyle: '#6c757d' },
        });
        pane.addChild(editor, false);
        pane.addChild(status, false);
        const layout = () => {
          const width = Number(pane.state.width) || 500;
          const height = Number(pane.state.height) || 400;
          editor.setState({ width: width - 12, height: height - 56 });
          status.setState({ top: height - 24, width: width - 12 });
        };
        pane.revalidate = function () {
          W.ICEWidget.prototype.revalidate.call(this);
          layout();
          return this;
        };
        setTimeout(layout, 0);
        handles.notepad = { editor, status };
        return pane;
      };

      /* ============================ 应用：画图 ============================ */
      class XPaintCanvas extends W.ICEWidget {
        constructor(props) {
          super({ fill: true, stroke: true, style: { fillStyle: '#ffffff', strokeStyle: '#a0a0a0' }, ...props });
          this.strokes = [];
          this.color = '#c1272d';
          this.brushWidth = 3;
          this.drawing = false;
          this.bound = false;
        }

        setColor(color) {
          this.color = color;
        }

        setBrushWidth(width) {
          this.brushWidth = width;
        }

        clear() {
          this.strokes = [];
          this.removeChildren([...this.childNodes]);
          this.revalidate();
        }

        getStrokeCount() {
          return this.strokes.length;
        }

        afterAddHandler() {
          super.afterAddHandler();
          if (this.bound || !this.ice || !this.ice.evtBus) return;
          this.bound = true;
          this.ice.evtBus.on('mousedown', this.__down, this);
          this.ice.evtBus.on('mousemove', this.__move, this);
          this.ice.evtBus.on('mouseup', this.__up, this);
        }

        __local(evt) {
          if (!this.ice || typeof this.ice.screenToWorld !== 'function') return null;
          const [wx, wy] = this.ice.screenToWorld(evt.offsetX, evt.offsetY);
          let left = 0;
          let top = 0;
          let node = this;
          while (node && node.state) {
            left += Number(node.state.left) || 0;
            top += Number(node.state.top) || 0;
            node = node.parentNode;
          }
          const x = wx - left;
          const y = wy - top;
          if (x < 0 || y < 0 || x > Number(this.state.width) || y > Number(this.state.height)) return null;
          return [x, y];
        }

        __down(evt) {
          const point = this.__local(evt);
          if (!point) return;
          this.drawing = true;
          this.current = [point];
          this.currentLine = new ICE.ICEPolyLine({
            points: [point, [point[0] + 0.5, point[1] + 0.5]],
            stroke: true,
            fill: false,
            style: { strokeStyle: this.color, lineWidth: this.brushWidth, lineCap: 'round' },
          });
          this.addChild(this.currentLine, false);
        }

        __move(evt) {
          if (!this.drawing) return;
          const point = this.__local(evt);
          if (!point) return;
          this.current.push(point);
          this.currentLine.setState({ points: this.current.slice() });
          if (this.ice) this.ice.dirty = true;
        }

        __up() {
          if (!this.drawing) return;
          this.drawing = false;
          this.strokes.push({ points: this.current, color: this.color, width: this.brushWidth });
          this.current = null;
          this.currentLine = null;
          this.revalidate();
        }
      }

      const buildPaint = () => {
        const pane = new W.ICEWidget({ width: 100, height: 100, fill: false, stroke: false, interactive: false });
        const toolPanel = new W.ICEPanel({
          left: 0,
          top: 0,
          width: 132,
          height: 100,
          interactive: false,
          style: { fillStyle: '#ece9d8' },
        });
        const canvas = new XPaintCanvas({ left: 0, top: 0, width: 100, height: 100 });
        const colors = ['#000000', '#c1272d', '#0d6efd', '#198754', '#ffc107', '#fd7e14'];
        colors.forEach((color, index) => {
          const swatch = new W.ICEWidget({
            id: 'paint-color-' + index,
            left: 12 + (index % 3) * 34,
            top: 14 + Math.floor(index / 3) * 34,
            width: 28,
            height: 28,
            radius: 4,
            fill: true,
            stroke: true,
            style: { fillStyle: color, strokeStyle: '#8a8a8a', lineWidth: 1 },
          });
          swatch.on('click', () => {
            canvas.setColor(color);
            toast('画笔颜色：' + color, 'info');
          });
          toolPanel.addChild(swatch, false);
        });
        const widthLabel = new W.ICELabel({
          left: 12,
          top: 96,
          width: 108,
          height: 18,
          text: '笔刷粗细',
          style: { fontSize: 11, fillStyle: '#333333' },
        });
        const brush = new W.ICESlider({
          left: 12,
          top: 116,
          width: 108,
          height: 18,
          min: 1,
          max: 12,
          value: 3,
          onChange: (value) => {
            canvas.setBrushWidth(Number(value));
            widthLabel.setText('笔刷粗细：' + value);
          },
        });
        const clearButton = new W.ICEButton({ left: 12, top: 146, width: 108, height: 26, text: '清空画布', size: 'small' });

      /* ============================ 应用：扫雷 ============================ */
      const buildMinesweeper = () => {
        const COLS = 9;
        const ROWS = 9;
        const MINES = 10;
        const pane = new W.ICEWidget({
          width: 100,
          height: 100,
          fill: true,
          stroke: false,
          interactive: false,
          style: { fillStyle: '#ece9d8' },
        });
        let mines = [];
        let revealed = [];
        let flagged = [];
        let over = false;
        const cells = [];
        const counter = new W.ICELabel({
          left: 10,
          top: 8,
          width: 60,
          height: 22,
          text: '💣 10',
          style: { fontSize: 13, fontWeight: '700', fillStyle: '#c1272d' },
        });
        const face = new W.ICEButton({ id: 'mine-reset', left: 96, top: 6, width: 32, height: 26, text: '🙂', size: 'small' });
        const timer = new W.ICELabel({
          left: 176,
          top: 8,
          width: 60,
          height: 22,
          text: '⏱ 0',
          align: 'right',
          style: { fontSize: 13, fontWeight: '700', fillStyle: '#0a246a' },
        });
        const grid = new W.ICEWidget({
          left: 10,
          top: 42,
          width: COLS * 26,
          height: ROWS * 26,
          fill: false,
          stroke: false,
          interactive: false,
        });
        const NORMAL = { fillStyle: '#c0c0c0', strokeStyle: '#808080' };
        const revealedStyle = { fillStyle: '#e6e6e6', strokeStyle: '#a0a0a0' };
        const numberColors = ['', '#0000ff', '#008000', '#ff0000', '#000080', '#800000', '#008080', '#000000', '#808080'];
        let seconds = 0;
        let timerHandle = null;

        const neighbors = (row, col) => {
          const out = [];
          for (let dr = -1; dr <= 1; dr += 1) {
            for (let dc = -1; dc <= 1; dc += 1) {
              if (!dr && !dc) continue;
              const r = row + dr;
              const c = col + dc;
              if (r >= 0 && r < ROWS && c >= 0 && c < COLS) out.push([r, c]);
            }
          }
          return out;
        };

        const reset = () => {
          mines = [];
          revealed = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
          flagged = Array.from({ length: ROWS }, () => Array(COLS).fill(false));
          over = false;
          seconds = 0;
          timer.setText('⏱ 0');
          counter.setText('💣 ' + MINES);
          face.setText('🙂');
          while (mines.length < MINES) {
            const index = Math.floor(Math.random() * ROWS * COLS);
            if (mines.indexOf(index) === -1) mines.push(index);
          }
          cells.forEach((cell, index) => {
            cell.node.setState({ style: { ...NORMAL }, interactive: true });
            cell.label.setText('');
          });
          if (timerHandle) clearInterval(timerHandle);
          timerHandle = setInterval(() => {
            if (over || seconds > 500) return;
            seconds += 1;
            timer.setText('⏱ ' + seconds);
          }, 1000);
        };

        const mineCount = (row, col) => neighbors(row, col).filter(([r, c]) => mines.indexOf(r * COLS + c) !== -1).length;

        const reveal = (row, col) => {
          if (over || revealed[row][col]) return;
          revealed[row][col] = true;
          const cell = cells[row * COLS + col];
          const isMine = mines.indexOf(row * COLS + col) !== -1;
          cell.node.setState({ style: { ...revealedStyle } });
          if (isMine) {
            cell.label.setText('💥');
            face.setText('😵');
            over = true;
            toast('踩到雷了！点笑脸重开', 'error');
            return;
          }
          const count = mineCount(row, col);
          cell.label.setText(count ? String(count) : '');
          cell.label.setState({ style: { ...cell.label.state.style, fillStyle: numberColors[count] || '#000000' } });
          if (!count) {
            neighbors(row, col).forEach(([r, c]) => reveal(r, c));
          }
          const safeLeft = ROWS * COLS - MINES - revealed.flat().filter(Boolean).length;
          if (safeLeft <= 0) {
            over = true;
            face.setText('😎');
            W.ICENotification.open(ice, { title: '扫雷胜利', description: `用时 ${seconds} 秒`, type: 'success' });
          }
        };

        for (let row = 0; row < ROWS; row += 1) {
          for (let col = 0; col < COLS; col += 1) {
            const index = row * COLS + col;
            const node = new W.ICEWidget({
              id: 'mine-' + index,
              left: col * 26,
              top: row * 26,
              width: 25,
              height: 25,
              radius: 0,
              fill: true,
              stroke: true,
              style: { ...NORMAL, lineWidth: 1 },
            });
            const label = new W.ICELabel({
              interactive: false,
              left: 0,
              top: 0,
              width: 25,
              height: 25,
              text: '',
              align: 'center',
              verticalAlign: 'middle',
              style: { fontSize: 13, fontWeight: '700', fillStyle: '#000000' },
            });
            node.addChild(label, false);
            node.on('click', () => reveal(row, col));
            node.on('contextmenu', () => {
              if (over || revealed[row][col]) return;
              flagged[row][col] = !flagged[row][col];
              label.setText(flagged[row][col] ? '🚩' : '');
              counter.setText('💣 ' + (MINES - flagged.flat().filter(Boolean).length));
            });
            grid.addChild(node, false);
            cells.push({ node, label });
          }
        }
        pane.addChildren([counter, face, timer, grid], { align: 'top' });
        face.on('click', reset);
        reset();
        handles.mines = { cells, counter, face, timer, reset, isOver: () => over, mines: () => mines.slice() };
        return pane;
      };

      /* ============================ 应用：显示属性 ============================ */

      /* ============================ 应用：我的文档 ============================ */
      const buildMyDocuments = () => {
        const pane = new W.ICEWidget({
          width: 100,
          height: 100,
          fill: true,
          stroke: false,
          interactive: false,
          style: { fillStyle: '#ffffff' },
        });
        const toolbar = new W.ICEButton({ left: 12, top: 10, width: 108, height: 26, text: '新建文件夹', size: 'small' });
        toolbar.on('click', () => toast('已新建文件夹', 'success'));
        const table = new W.ICETable({
          id: 'documents-table',
          left: 12,
          top: 46,
          width: 100,
          rowHeight: 32,
          columns: [
            { key: 'name', title: '名称' },
            { key: 'type', title: '类型', width: 110 },
            { key: 'size', title: '大小', width: 90, align: 'right' },

          ],
          data: [
            { name: '季度总结.doc', type: 'Word 文档', size: '248 KB', date: '2026-09-10' },
            { name: '预算表.xls', type: 'Excel 工作表', size: '96 KB', date: '2026-09-08' },
            { name: '产品图.jpg', type: 'JPEG 图像', size: '1.2 MB', date: '2026-09-06' },
            { name: '安装说明.txt', type: '文本文档', size: '4 KB', date: '2026-09-04' },
            { name: '会议纪要.doc', type: 'Word 文档', size: '132 KB', date: '2026-09-02' },
            { name: '归档.zip', type: '压缩文件', size: '18.4 MB', date: '2026-08-30' },
            { name: '通讯录.csv', type: 'CSV 文件', size: '12 KB', date: '2026-08-28' },
            { name: '桌面截图.png', type: 'PNG 图像', size: '860 KB', date: '2026-08-26' },
            { name: '备份.bak', type: '备份文件', size: '204 MB', date: '2026-08-20' },
          ],

        pane.addChild(toolbar, false);

        const layout = () => {

      /* ============================ 应用：IE 浏览器 ============================ */
      const buildIE = () => {

        const status = new W.ICELabel({

        go.on('click', () => {

          pageBody.setText(

              : 'IE 也找不到这个地址 —— 毕竟现在只有 canvas。试试 http://www.ice-desktop.local/',

        };

      /* ============================ 应用注册表 ============================ */
      let currentWallpaper = 'bliss';
      const setWallpaper = (key) => {
        currentWallpaper = key;
        paintWallpaper(key);
      };

        { key: 'computer', title: '我的电脑', icon: '🖥', width: 720, height: 460, build: buildMyComputer },
        { key: 'documents', title: '我的文档', icon: '📁', width: 640, height: 420, build: buildMyDocuments },
        { key: 'notepad', title: '未命名 - 记事本', icon: '📝', width: 560, height: 420, build: buildNotepad },
        { key: 'paint', title: '未命名 - 画图', icon: '🎨', width: 720, height: 520, build: buildPaint },
        { key: 'minesweeper', title: '扫雷', icon: '💣', width: 300, height: 340, build: buildMinesweeper },
        { key: 'ie', title: 'ICE 桌面 - Microsoft Internet Explorer', icon: '🌐', width: 700, height: 460, build: buildIE },
        { key: 'display', title: '显示 属性', icon: '⚙', width: 500, height: 260, build: buildDisplayProperties },
      ];

      /* ============================ 桌面图标 ============================ */
      const iconTiles = [];
      const ICON_ORDER = ['computer', 'documents', 'notepad', 'paint', 'minesweeper', 'ie', 'display'];
      ICON_ORDER.forEach((key, index) => {
        const app = APPS.find((item) => item.key === key);
        const tile = new W.ICEIconTile({
          id: 'icon-' + key,
          icon: app.icon,

          left: 18,
          top: 18 + index * 84,
          width: 86,
          height: 78,
          onSelect: (selected) => {
            if (selected) {
              iconTiles.forEach((other) => other !== tile && other.setSelected(false));
            }
          },
          onOpen: () => openApp(app),
        });
        iconLayer.addChild(tile, false);
        iconTiles.push(tile);
      });

      const clearIconSelection = () => iconTiles.forEach((tile) => tile.setSelected(false));

      /* ============================ 开始菜单 ============================ */
      const buildStartMenuContent = () => {
        const pane = new W.ICEWidget({
          width: 360,
          height: 420,
          fill: true,
          stroke: false,
          interactive: false,
          style: { fillStyle: '#ffffff' },
        });
        const header = new W.ICEWidget({
          left: 0,
          top: 0,
          width: 360,
          height: 62,
          fill: false,
          stroke: false,
          interactive: false,
        });
        gradient(header, 0, 0, 360, 62, '#0a5cd8', '#3f8cf3', 8);
        header.addChild(new W.ICEAvatar({ left: 12, top: 12, text: 'FM', size: 38 }), false);
        header.addChild(
          new W.ICELabel({
            left: 60,
            top: 14,
            width: 280,
            text: 'Felix Morgan',
            style: { fontSize: 14, fontWeight: '700', fillStyle: '#ffffff', fontFamily: XPFONT },
          }),
          false,
        );
        pane.addChild(header, false);
        const programKeys = ['computer', 'documents', 'notepad', 'paint', 'minesweeper', 'ie'];
        programKeys.forEach((key, index) => {

          const row = new W.ICEWidget({
            id: 'start-program-' + key,
            left: 6,
            top: 72 + index * 40,
            width: 210,
            height: 36,
            radius: 3,
            fill: false,
            stroke: false,
          });
          row.addChild(
            new W.ICELabel({
              interactive: false,
              left: 10,
              top: 0,
              width: 190,
              height: 36,
              text: `${app.icon}   ${app.title}`,
              verticalAlign: 'middle',
              style: { fontSize: 12, fillStyle: '#0a246a', fontFamily: XPFONT },
            }),
            false,
          );
          row.on('click', () => {
            startMenuHandle && startMenuHandle.close();
            openApp(app);

          row.on('hoverchange', (evt) => {

          pane.addChild(row, false);

        const footer = new W.ICEWidget({
          left: 0,
          top: 362,
          width: 360,
          height: 58,
          fill: false,
          stroke: false,
          interactive: false,
        });
        gradient(footer, 0, 0, 360, 58, '#3f8cf3', '#0a5cd8', 8);
        footer.addChild(
          new W.ICELabel({
            left: 12,
            top: 0,
            width: 160,
            height: 58,
            text: '🔒  注销',

        footer.addChild(shutDown, false);

        return pane;
      };

      startButton.on('click', () => {

        }

          offset: 6,
          closeOnOutsideClick: true,

      openApp(APPS[0]);

      window.__result = {
        ice,
        desktop,
        wallpaper,
        taskbar,
        taskButtons,
        startButton,
        clockLabel,
        openWindows,
        iconTiles,
        openApp,
        closeWindow,
        minimizeWindow,
        focusWindow,
        setWallpaper,
        APPS,
        WALLPAPERS,
        handles,
      };
    </script>
